<script>
function xferReceive(auto) {
  const code = String(
    typeof auto === 'string' ? auto : val('xfer-code-in')
  ).trim().toUpperCase();

  if (code.length < 4) {
    setSt('xfer-recv-status', 'Zadej kód z prvního zařízení.', false);
    return;
  }

  closeXfer();
  setSt('xfer-recv-status', 'Připojuji se...');

  const pr = new Peer();
  xferPeer = pr;
  let done = false;

  const num = v => Math.min(
    1000000,
    Math.max(0, parseInt(v, 10) || 0)
  );

  pr.on('open', () => {
    const c = pr.connect('KAX-' + code, { reliable: true });

    c.on('data', d => {
      if (done || !d || d.type !== 'xfer' || !d.data) return;
      done = true;

      const o = d.data;

      // Načteme dosavadní stav a zachováme všechny existující klíče.
      refreshShop();

      const prijateKlice = num(o.keys);
      const prijataBanka = num(o.bank);

      const predPenezenka = shop.keys;
      const predBanka = shop.bank;
      const predCelkem = predPenezenka + predBanka;

      // Příchozí klíče se PŘIČTOU, nikdy nenahradí dosavadní stav.
      shop.keys += prijateKlice;
      shop.bank += prijataBanka;

      ['sword', 'boots', 'armor'].forEach(k => {
        shop[k] = Math.max(shop[k], +o[k] || 0);
      });

      saveShop();
      updateShopLabel();
      updateXferHave();

      const poCelkem = shop.keys + shop.bank;

      setSt(
        'xfer-recv-status',
        '✔ Přijato ' + keysText(prijateKlice) +
        (prijataBanka
          ? ' a ' + keysText(prijataBanka) + ' do banky'
          : '') +
        '. Před přenosem: peněženka ' +
        keysText(predPenezenka) +
        ', banka ' + keysText(predBanka) +
        ', celkem ' + keysText(predCelkem) +
        '. Po přenosu: peněženka ' +
        keysText(shop.keys) +
        ', banka ' + keysText(shop.bank) +
        ', celkem ' + keysText(poCelkem) + '.',
        true
      );

      try {
        c.send({ type: 'ack' });
      } catch (e) {}

      setTimeout(closeXfer, 1000);
    });

    c.on('error', () => {
      setSt(
        'xfer-recv-status',
        'Chyba spojení. Zkus to znovu.',
        false
      );
    });
  });

  pr.on('error', err => {
    setSt(
      'xfer-recv-status',
      err && err.type === 'peer-unavailable'
        ? 'Kód nesedí nebo už vypršel.'
        : 'Nedaří se připojit k internetu.',
      false
    );
  });
}
</script>
