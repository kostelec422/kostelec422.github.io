*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#1e1b18;color:#eee;padding:12px;display:flex;flex-direction:column;align-items:center}

.b{color:#111;text-shadow:0 0 1px #aaa}
.co{position:absolute;font-size:10px;opacity:.6;color:#333;text-shadow:none}
