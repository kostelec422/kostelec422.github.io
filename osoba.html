<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOHLED // ŠPIONÁŽNÍ TERMINÁL</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#050805;color:#39ff6a;font-family:"Courier New",monospace;min-height:100vh}
  header{padding:14px 18px;border-bottom:1px solid #1d4d2a;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  h1{margin:0;font-size:18px;letter-spacing:4px;text-shadow:0 0 8px #39ff6a}
  .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-block;background:#0b1d10;color:#39ff6a;border:1px solid #39ff6a;padding:12px 16px;font:inherit;cursor:pointer;letter-spacing:2px;text-transform:uppercase;font-size:12px;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .btn:active{background:#39ff6a;color:#000}
  .btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
  main{display:grid;grid-template-columns:1fr 280px;gap:14px;padding:14px}
  @media(max-width:850px){main{grid-template-columns:1fr}}
  .screen{position:relative;border:1px solid #1d4d2a;background:#000;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{max-width:100%;max-height:75vh;display:block}
  .scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
  .vig{pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,.85)}
  #caption{pointer-events:none;position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.92));color:#ff3b3b;font-size:clamp(14px,2.2vw,22px);font-weight:bold;letter-spacing:2px;text-shadow:0 0 10px red;min-height:60px}
  #placeholder{position:absolute;text-align:center;opacity:.7;letter-spacing:3px;line-height:2;pointer-events:none}
  aside{border:1px solid #1d4d2a;padding:12px;background:#030a04;display:flex;flex-direction:column;gap:10px}
  aside h2{margin:0;font-size:13px;letter-spacing:3px;border-bottom:1px solid #1d4d2a;padding-bottom:6px}
  #log{font-size:12px;line-height:1.6;overflow-y:auto;max-height:45vh}
  #log div{border-left:2px solid #39ff6a;padding-left:8px;margin-bottom:6px}
  #log div.warn{border-color:#ff3b3b;color:#ff7070}
  #status{font-size:12px;color:#ffd24a}
  #out{width:100%;display:none;background:#000}
</style>
</head>
<body>
<header>
  <h1>◉ DOHLED // TAJNÝ TERMINÁL</h1>
  <div class="btns">
    <label class="btn">Nahrát video / foto<input type="file" id="file" accept="video/*,image/*"></label>
    <button class="btn" id="snd" type="button" onclick="toggleSound()">Zvuk: ZAP</button>
    <button class="btn" id="rec" type="button" onclick="toggleRec()">● Vytvořit video</button>
  </div>
</header>
<main>
  <div class="screen">
    <div id="placeholder">[ ČEKÁM NA VSTUPNÍ MATERIÁL ]<br>NAHRAJ VIDEO NEBO FOTOGRAFII</div>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="scan"></div><div class="vig"></div>
    <div id="caption"></div>
  </div>
  <aside>
    <h2>PROTOKOL UDÁLOSTÍ</h2>
    <div id="status">Načítám AI moduly na pozadí…</div>
    <div id="log"></div>
    <video id="out" controls playsinline></video>
  </aside>
</main>

<script>
var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), capEl=document.getElementById('caption'),
    logEl=document.getElementById('log'), statusEl=document.getElementById('status');
window.onerror=function(m){statusEl.textContent='Chyba: '+m;};
