<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOHLED // ŠPIONÁŽNÍ TERMINÁL</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#050805;color:#39ff6a;font-family:"Courier New",monospace;min-height:100vh}
  header{padding:14px 18px;border-bottom:1px solid #1d4d2a;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  h1{margin:0;font-size:18px;letter-spacing:4px;text-shadow:0 0 8px #39ff6a}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{background:#0b1d10;color:#39ff6a;border:1px solid #39ff6a;padding:10px 16px;font:inherit;cursor:pointer;letter-spacing:2px;text-transform:uppercase;font-size:12px}
  button:hover{background:#39ff6a;color:#000}
  #file{position:absolute;left:-9999px}
  main{display:grid;grid-template-columns:1fr 280px;gap:14px;padding:14px}
  @media(max-width:850px){main{grid-template-columns:1fr}}
  .screen{position:relative;border:1px solid #1d4d2a;background:#000;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{max-width:100%;max-height:75vh;display:block}
  .scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
  .vig{pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,.85)}
  #caption{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.92));color:#ff3b3b;font-size:clamp(14px,2.2vw,22px);font-weight:bold;letter-spacing:2px;text-shadow:0 0 10px red;min-height:60px}
  #placeholder{position:absolute;text-align:center;opacity:.7;letter-spacing:3px;line-height:2;pointer-events:none}
  aside{border:1px solid #1d4d2a;padding:12px;background:#030a04;display:flex;flex-direction:column;gap:10px}
  aside h2{margin:0;font-size:13px;letter-spacing:3px;border-bottom:1px solid #1d4d2a;padding-bottom:6px}
  #log{font-size:12px;line-height:1.6;overflow-y:auto;max-height:55vh}
  #log div{border-left:2px solid #39ff6a;padding-left:8px;margin-bottom:6px}
  #log div.warn{border-color:#ff3b3b;color:#ff7070}
  #status{font-size:12px;color:#ffd24a}
</style>
</head>
<body>
<header>
  <h1>◉ DOHLED // TAJNÝ TERMINÁL</h1>
  <div class="btns">
    <button id="up" type="button">Nahrát video / foto</button>
    <button id="snd" type="button">Zvuk: ZAP</button>
  </div>
  <input type="file" id="file" accept="video/*,image/*">
</header>
<main>
  <div class="screen">
    <div id="placeholder">[ ČEKÁM NA VSTUPNÍ MATERIÁL ]<br>NAHRAJ VIDEO NEBO FOTOGRAFII</div>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="scan"></div><div class="vig"></div>
    <div id="caption"></div>
  </div>
  <aside>
    <h2>PROTOKOL UDÁLOSTÍ</h2>
    <div id="status">Načítám AI modul na pozadí…</div>
    <div id="log"></div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), capEl = $('caption'), logEl = $('log'), statusEl = $('status');

const CZ = {cup:'hrníček',bottle:'láhev','wine glass':'sklenici','cell phone':'telefon',laptop:'notebook',book:'knihu',
  knife:'nůž',scissors:'nůžky',backpack:'batoh',handbag:'kabelku',umbrella:'deštník',remote:'ovladač',
  keyboard:'klávesnici',mouse:'myš',fork:'vidličku',spoon:'lžíci',bowl:'misku',toothbrush:'kartáček',suitcase:'kufr'};

let model = null, video = null, running = false, busy = false, lastDet = 0;
let persons = [], holding = {}, personPresent = false, absent = 0;
let audio = null, soundOn = true, drone = null;
let prevFrame = null, motionBox = null;
const sm = document.createElement('canvas'); sm.width = 64; sm.height = 36;
const sctx = sm.getContext('2d', {willReadFrequently:true});

/* ---------- ZVUK ---------- */
function initAudio(){
  if(audio) return;
  try{
    audio = new (window.AudioContext||window.webkitAudioContext)();
    const master = audio.createGain(); master.gain.value = .5; master.connect(audio.destination); audio.master = master;
    drone = audio.createGain(); drone.gain.value = soundOn ? .06 : 0; drone.connect(master);
    const lp = audio.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; lp.connect(drone);
    [55,55.7,82.4].forEach(f=>{const o=audio.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.connect(lp); o.start();});
    const lfo=audio.createOscillator(), lg=audio.createGain(); lfo.frequency.value=.12; lg.gain.value=90; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  }catch(e){ audio = null; }
}
function sting(kind){
  if(!audio || !soundOn) return;
  const t = audio.currentTime, g = audio.createGain();
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.05); g.gain.exponentialRampToValueAtTime(.001,t+1.8);
  g.connect(audio.master);
  const base = kind==='alert' ? 520 : 330;
  [base, base*1.0595, base*1.41].forEach((f,i)=>{
    const o=audio.createOscillator(); o.type=i?'triangle':'sine';
    o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.55,t+1.6);
    const tr=audio.createOscillator(), tg=audio.createGain(); tr.frequency.value=7+i*2; tg.gain.value=25; tr.connect(tg); tg.connect(o.frequency);
    o.connect(g); o.start(t); tr.start(t); o.stop(t+1.9); tr.stop(t+1.9);
  });
}
$('snd').addEventListener('click', ()=>{
  initAudio(); if(audio && audio.state==='suspended') audio.resume();
  soundOn = !soundOn;
  if(drone) drone.gain.value = soundOn ? .06 : 0;
  $('snd').textContent = 'Zvuk: ' + (soundOn?'ZAP':'VYP');
  if(soundOn) sting('alert');
});

/* ---------- TITULKY ---------- */
let typeTimer = null, lastSay = '', lastSayT = 0;
function say(text, level){
  const now = Date.now();
  if(text===lastSay && now-lastSayT<4000) return;
  lastSay = text; lastSayT = now;
  const row = document.createElement('div'); if(level==='alert') row.className='warn';
  row.textContent = `[${new Date().toLocaleTimeString('cs-CZ')}] ${text}`;
  logEl.prepend(row); while(logEl.children.length>40) logEl.lastChild.remove();
  clearInterval(typeTimer); let i=0; const full='▶ '+text.toUpperCase();
  typeTimer = setInterval(()=>{ capEl.textContent = full.slice(0,++i)+'█'; if(i>=full.length){clearInterval(typeTimer);capEl.textContent=full;} },35);
  sting(level);
}

/* ---------- LOGIKA ---------- */
const inside=(o,p)=>{const cx=o.bbox[0]+o.bbox[2]/2, cy=o.bbox[1]+o.bbox[3]/2, m=20;
  return cx>p.bbox[0]-m&&cx<p.bbox[0]+p.bbox[2]+m&&cy>p.bbox[1]-m&&cy<p.bbox[1]+p.bbox[3]+m;};

function analyze(preds, isVideo){
  persons = preds.filter(p=>p.class==='person' && p.score>.45);
  const objs = preds.filter(p=>p.class!=='person' && p.score>.4);
  if(persons.length){
    absent = 0;
    if(!personPresent){ personPresent = true; say(persons.length>1?`V záběru je ${persons.length} osob`:'Osoba vstoupila do záběru','alert'); }
  } else if(personPresent && isVideo && ++absent>8){ personPresent=false; holding={}; say('Osoba opustila záběr. Sleduji dál…'); }
  if(!persons.length) return;
  const p = persons.reduce((a,b)=>a.bbox[2]*a.bbox[3]>b.bbox[2]*b.bbox[3]?a:b);
  const near = {}; objs.forEach(o=>{ if(inside(o,p) && CZ[o.class]) near[o.class]=true; });
  if(!isVideo){
    const n = Object.keys(near).map(k=>CZ[k]);
    say(n.length?`Osoba je v kontaktu s předmětem: ${n.join(', ')}`:'Osoba zachycena. Žádný podezřelý předmět.','alert'); return;
  }
  for(const k in near){ holding[k]=holding[k]||{n:0,on:false}; holding[k].n++;
    if(holding[k].n>=3 && !holding[k].on){ holding[k].on=true; say(`Osoba si vzala ${CZ[k]}`,'alert'); } }
  for(const k in holding){ if(!near[k]){ holding[k].n--; if(holding[k].n<=-3){ if(holding[k].on) say(`Osoba odložila ${CZ[k]}`); delete holding[k]; } } }
}

/* ZÁLOŽNÍ DETEKCE POHYBU (když AI model není k dispozici) */
function detectMotion(src){
  sctx.drawImage(src,0,0,64,36);
  const d = sctx.getImageData(0,0,64,36).data, cur = new Uint8Array(64*36);
  for(let i=0;i<cur.length;i++) cur[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
  let minX=64,minY=36,maxX=0,maxY=0,cnt=0;
  if(prevFrame) for(let y=0;y<36;y++)for(let x=0;x<64;x++){
    if(Math.abs(cur[y*64+x]-prevFrame[y*64+x])>28){cnt++; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;}
  }
  prevFrame = cur;
  if(cnt>25){
    const sx=cv.width/64, sy=cv.height/36;
    motionBox=[minX*sx,minY*sy,(maxX-minX+1)*sx,(maxY-minY+1)*sy];
    if(!personPresent){ personPresent=true; say('Zaznamenán pohyb v zóně. Možný subjekt.','alert'); }
    absent=0;
  } else { motionBox=null; if(personPresent && ++absent>10){ personPresent=false; say('Pohyb ustal. Sleduji dál…'); } }
}

/* ---------- VYKRESLENÍ ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function silhouette(b,i,label){
  const [x,y,w,h]=b, hr=Math.min(w*.24,h*.13), cx=x+w/2;
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,y+hr,hr*.9,hr,0,0,Math.PI*2); ctx.fill();
  rr(x,y+hr*1.9,w,Math.max(4,h-hr*1.9),Math.min(w,h)*.18); ctx.fill();
  ctx.strokeStyle='#ff2b2b'; ctx.lineWidth=2; ctx.setLineDash([8,5]); ctx.strokeRect(x-6,y-6,w+12,h+12); ctx.setLineDash([]);
  ctx.fillStyle='#ff2b2b'; ctx.font='bold 14px Courier New';
  ctx.fillText(label||`SUBJEKT #${i+1} // NEZNÁMÝ`, x-6, Math.max(14,y-12));
}
function hud(isVideo){
  const t=new Date(); ctx.font='bold 15px Courier New'; ctx.fillStyle='#39ff6a';
  ctx.fillText(t.toLocaleDateString('cs-CZ')+' '+t.toLocaleTimeString('cs-CZ'),14,24);
  ctx.fillText('KAM-07 // NOČNÍ REŽIM',14,44);
  if(isVideo && Math.
