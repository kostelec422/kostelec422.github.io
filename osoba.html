<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOHLED // ŠPIONÁŽNÍ TERMINÁL</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#050805;color:#39ff6a;font-family:"Courier New",monospace;min-height:100vh}
  header{padding:14px 18px;border-bottom:1px solid #1d4d2a;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  h1{margin:0;font-size:18px;letter-spacing:4px;text-shadow:0 0 8px #39ff6a}
  .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-block;background:#0b1d10;color:#39ff6a;border:1px solid #39ff6a;padding:12px 16px;font:inherit;cursor:pointer;letter-spacing:2px;text-transform:uppercase;font-size:12px;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .btn:active{background:#39ff6a;color:#000}
  .btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
  main{display:grid;grid-template-columns:1fr 280px;gap:14px;padding:14px}
  @media(max-width:850px){main{grid-template-columns:1fr}}
  .screen{position:relative;border:1px solid #1d4d2a;background:#000;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{max-width:100%;max-height:75vh;display:block}
  .scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
  .vig{pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(0,0,0,.85)}
  #caption{pointer-events:none;position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.92));color:#ff3b3b;font-size:clamp(14px,2.2vw,22px);font-weight:bold;letter-spacing:2px;text-shadow:0 0 10px red;min-height:60px}
  #placeholder{position:absolute;text-align:center;opacity:.7;letter-spacing:3px;line-height:2;pointer-events:none}
  aside{border:1px solid #1d4d2a;padding:12px;background:#030a04;display:flex;flex-direction:column;gap:10px}
  aside h2{margin:0;font-size:13px;letter-spacing:3px;border-bottom:1px solid #1d4d2a;padding-bottom:6px}
  #log{font-size:12px;line-height:1.6;overflow-y:auto;max-height:45vh}
  #log div{border-left:2px solid #39ff6a;padding-left:8px;margin-bottom:6px}
  #log div.warn{border-color:#ff3b3b;color:#ff7070}
  #status{font-size:12px;color:#ffd24a}
  #out{width:100%;display:none;background:#000}
</style>
</head>
<body>
<header>
  <h1>◉ DOHLED // TAJNÝ TERMINÁL</h1>
  <div class="btns">
    <label class="btn">Nahrát video / foto<input type="file" id="file" accept="video/*,image/*"></label>
    <button class="btn" id="snd" type="button" onclick="toggleSound()">Zvuk: ZAP</button>
    <button class="btn" id="rec" type="button" onclick="toggleRec()">● Vytvořit video</button>
  </div>
</header>
<main>
  <div class="screen">
    <div id="placeholder">[ ČEKÁM NA VSTUPNÍ MATERIÁL ]<br>NAHRAJ VIDEO NEBO FOTOGRAFII</div>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="scan"></div><div class="vig"></div>
    <div id="caption"></div>
  </div>
  <aside>
    <h2>PROTOKOL UDÁLOSTÍ</h2>
    <div id="status">Načítám AI modul na pozadí…</div>
    <div id="log"></div>
    <video id="out" controls playsinline></video>
  </aside>
</main>

<script>
var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), capEl=document.getElementById('caption'),
    logEl=document.getElementById('log'), statusEl=document.getElementById('status');
window.onerror=function(m){statusEl.textContent='Chyba: '+m;};

var CZ={cup:'hrníček',bottle:'láhev','wine glass':'sklenici','cell phone':'telefon',laptop:'notebook',book:'knihu',
  knife:'nůž',scissors:'nůžky',backpack:'batoh',handbag:'kabelku',umbrella:'deštník',remote:'ovladač',
  keyboard:'klávesnici',mouse:'myš',fork:'vidličku',spoon:'lžíci',bowl:'misku',toothbrush:'kartáček',suitcase:'kufr'};

var model=null, video=null, running=false, busy=false, lastDet=0;
var persons=[], holding={}, personPresent=false, absent=0;
var audio=null, soundOn=true, drone=null, prevFrame=null, motionBox=null;
var sm=document.createElement('canvas'); sm.width=64; sm.height=36;
var sctx=sm.getContext('2d');

/* ZVUK */
function initAudio(){
  if(audio) { if(audio.state==='suspended') audio.resume(); return; }
  try{
    audio=new (window.AudioContext||window.webkitAudioContext)();
    var master=audio.createGain(); master.gain.value=.5; master.connect(audio.destination); audio.master=master;
    drone=audio.createGain(); drone.gain.value=soundOn?.06:0; drone.connect(master);
    var lp=audio.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; lp.connect(drone);
    [55,55.7,82.4].forEach(function(f){var o=audio.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.connect(lp); o.start();});
    var lfo=audio.createOscillator(), lg=audio.createGain(); lfo.frequency.value=.12; lg.gain.value=90; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    if(audio.state==='suspended') audio.resume();
  }catch(e){audio=null;}
}
function sting(kind){
  if(!audio||!soundOn) return;
  try{
    var t=audio.currentTime, g=audio.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.05); g.gain.exponentialRampToValueAtTime(.001,t+1.8);
    g.connect(audio.master);
    var base=kind==='alert'?520:330;
    [base,base*1.0595,base*1.41].forEach(function(f,i){
      var o=audio.createOscillator(); o.type=i?'triangle':'sine';
      o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.55,t+1.6);
      var tr=audio.createOscillator(), tg=audio.createGain(); tr.frequency.value=7+i*2; tg.gain.value=25; tr.connect(tg); tg.connect(o.frequency);
      o.connect(g); o.start(t); tr.start(t); o.stop(t+1.9); tr.stop(t+1.9);
    });
  }catch(e){}
}
function toggleSound(){
  initAudio(); soundOn=!soundOn;
  if(drone) drone.gain.value=soundOn?.06:0;
  document.getElementById('snd').textContent='Zvuk: '+(soundOn?'ZAP':'VYP');
  if(soundOn) sting('alert');
}

/* TITULKY */
var typeTimer=null, lastSay='', lastSayT=0;
function say(text,level){
  var now=Date.now(); if(text===lastSay&&now-lastSayT<4000) return;
  lastSay=text; lastSayT=now;
  var row=document.createElement('div'); if(level==='alert') row.className='warn';
  row.textContent='['+new Date().toLocaleTimeString('cs-CZ')+'] '+text;
  logEl.insertBefore(row,logEl.firstChild); while(logEl.children.length>40) logEl.removeChild(logEl.lastChild);
  clearInterval(typeTimer); var i=0, full='▶ '+text.toUpperCase();
  typeTimer=setInterval(function(){capEl.textContent=full.slice(0,++i)+'█'; if(i>=full.length){clearInterval(typeTimer);capEl.textContent=full;}},35);
  sting(level);
}

/* LOGIKA */
function inside(o,p){var cx=o.bbox[0]+o.bbox[2]/2, cy=o.bbox[1]+o.bbox[3]/2, m=20;
  return cx>p.bbox[0]-m&&cx<p.bbox[0]+p.bbox[2]+m&&cy>p.bbox[1]-m&&cy<p.bbox[1]+p.bbox[3]+m;}
function analyze(preds,isVideo){
  persons=preds.filter(function(p){return p.class==='person'&&p.score>.45;});
  var objs=preds.filter(function(p){return p.class!=='person'&&p.score>.4;});
  if(persons.length){
    absent=0;
    if(!personPresent){personPresent=true; say(persons.length>1?'V záběru je '+persons.length+' osob':'Osoba vstoupila do záběru','alert');}
  } else if(personPresent&&isVideo&&++absent>8){personPresent=false; holding={}; say('Osoba opustila záběr. Sleduji dál…');}
  if(!persons.length) return;
  var p=persons.reduce(function(a,b){return a.bbox[2]*a.bbox[3]>b.bbox[2]*b.bbox[3]?a:b;});
  var near={}; objs.forEach(function(o){if(inside(o,p)&&CZ[o.class]) near[o.class]=true;});
  if(!isVideo){
    var n=Object.keys(near).map(function(k){return CZ[k];});
    say(n.length?'Osoba je v kontaktu s předmětem: '+n.join(', '):'Osoba zachycena. Žádný podezřelý předmět.','alert'); return;
  }
  for(var k in near){holding[k]=holding[k]||{n:0,on:false}; holding[k].n++;
    if(holding[k].n>=3&&!holding[k].on){holding[k].on=true; say('Osoba si vzala '+CZ[k],'alert');}}
  for(var k2 in holding){if(!near[k2]){holding[k2].n--; if(holding[k2].n<=-3){if(holding[k2].on) say('Osoba odložila '+CZ[k2]); delete holding[k2];}}}
}
function detectMotion(src){
  sctx.drawImage(src,0,0,64,36);
  var d=sctx.getImageData(0,0,64,36).data, cur=new Uint8Array(64*36);
  for(var i=0;i<cur.length;i++) cur[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
  var minX=64,minY=36,maxX=0,maxY=0,cnt=0;
  if(prevFrame) for(var y=0;y<36;y++)for(var x=0;x<64;x++){
    if(Math.abs(cur[y*64+x]-prevFrame[y*64+x])>28){cnt++; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;}
  }
  prevFrame=cur;
  if(cnt>25){
    var sx=cv.width/64, sy=cv.height/36;
    motionBox=[minX*sx,minY*sy,(maxX-minX+1)*sx,(maxY-minY+1)*sy];
    if(!personPresent){personPresent=true; say('Zaznamenán pohyb v zóně. Možný subjekt.','alert');}
    absent=0;
  } else {motionBox=null; if(personPresent&&++absent>10){personPresent=false; say('Pohyb ustal. Sleduji dál…');}}
}

/* VYKRESLENÍ */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function silhouette(b,i,label){
  var x=b[0],y=b[1],w=b[2],h=b[3], hr=Math.min(w*.24,h*.13), cx=x+w/2;
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(cx,y+hr,hr*.9,hr,0,0,Math.PI*2); ctx.fill();
  rr(x,y+hr*1.9,w,Math.max(4,h-hr*1.9),Math.min(w,h)*.18); ctx.fill();
  ctx.strokeStyle='#ff2b2b'; ctx.lineWidth=2; ctx.setLineDash([8,5]); ctx.strokeRect(x-6,y-6,w+12,h+12); ctx.setLineDash([]);
  ctx.fillStyle='#ff2b2b'; ctx.font='bold 14px Courier New';
  ctx.fillText(label||('SUBJEKT #'+(i+1)+' // NEZNÁMÝ'),x-6,Math.max(14,y-12));
}
function hud(isVideo){
  var t=new Date(); ctx.font='bold 15px Courier New'; ctx.fillStyle='#39ff6a';
  ctx.fillText(t.toLocaleDateString('cs-CZ')+' '+t.toLocaleTimeString('cs-CZ'),14,24);
  ctx.fillText('KAM-07 // NOČNÍ REŽIM',14,44);
  if(isVideo&&Math.floor(t.getTime()/600)%2===0){ctx.fillStyle='#ff2b2b';ctx.beginPath();ctx.arc(cv.width-90,20,7,0,7);ctx.fill();ctx.fillText('REC',cv.width-76,26);}
  ctx.strokeStyle='#39ff6a'; ctx.lineWidth=2;
  [[10,10,1,1],[cv.width-10,10,-1,1],[10,cv.height-10,1,-1],[cv.width-10,cv.height-10,-1,-1]].forEach(function(a){
    ctx.beginPath();ctx.moveTo(a[0],a[1]+28*a[3]);ctx.lineTo(a[0],a[1]);ctx.lineTo(a[0]+28*a[2],a[1]);ctx.stroke();});
}
function render(src,isVideo){
  ctx.drawImage(src,0,0,cv.width,cv.height);
  ctx.fillStyle='rgba(0,40,10,.35)'; ctx.fillRect(0,0,cv.width,cv.height);
  if(model) persons.forEach(function(p,i){silhouette(p.bbox,i);});
  else if(motionBox) silhouette(motionBox,0,'POHYB // NEIDENTIFIKOVÁN');
  hud(isVideo);
}

/* SMYČKA */
function loop(){
  if(!running) return;
  var now=performance.now();
  if(!video.paused&&!video.ended&&now-lastDet>200){
    lastDet=now;
    if(model){ if(!busy){busy=true; model.detect(video).then(function(p){analyze(p,true);busy=false;}).catch(function(){busy=false;});} }
    else detectMotion(video);
  }
  render(video,true);
  requestAnimationFrame(loop);
}

/* NAHRÁVÁNÍ */
document.getElementById('file').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f) return;
  initAudio();
  running=false; persons=[]; holding={}; personPresent=false; absent=0; prevFrame=null; motionBox=null;
  if(video&&video.parentNode) video.parentNode.removeChild(video);
  document.getElementById('placeholder').style.display='none'; capEl.textContent='';
  var url=URL.createObjectURL(f);
  if(f.type.indexOf('image/')===0){
    var img=new Image();
    img.onload=function(){
      cv.width=img.naturalWidth; cv.height=img.naturalHeight;
      var done=function(){render(img,false);};
      if(model){ model.detect(img).then(function(p){analyze(p,false);done();}).catch(done); }
      else {say('Snímek přijat. AI modul není dostupný – analýza osob nemožná.'); done();}
    }; img.src=url;
  } else {
    video=document.createElement('video'); video.muted=true; video.loop=true; video.preload='auto';
    video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
    video.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none';
    document.body.appendChild(video);
    var started=false, v=video;
    var start=function(){
      if(started||!v.videoWidth) return; started=true;
      var s=Math.min(1,960/v.videoWidth);
      cv.width=Math.round(v.videoWidth*s); cv.height=Math.round(v.videoHeight*s);
      var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){say('Klepni na obrazovku pro spuštění videa.');});
      running=true;
      statusEl.textContent=model?'Sledování probíhá (AI)…':'Sledování probíhá (pouze pohyb)…';
      say('Záznam spuštěn. Sleduji.'); loop();
    };
    v.addEventListener('loadedmetadata',start); v.addEventListener('loadeddata',start); v.addEventListener('canplay',start);
    v.addEventListener('error',function(){say('Video se nepodařilo načíst. Zkus formát MP4.');});
    v.src=url; v.load();
  }
  e.target.value='';
});

/* VYTVOŘENÍ VIDEA */
var rec=null, chunks=[];
function toggleRec(){
  var b=document.getElementById('rec');
  if(rec&&rec.state==='recording'){rec.stop();return;}
  if(!running){say('Nejdřív nahraj video.');return;}
  if(!cv.captureStream||!window.MediaRecorder){say('Tohle zařízení neumí vytvořit video z výstupu.');return;}
  try{
    initAudio();
    var stream=cv.captureStream(30);
    if(audio&&audio.createMediaStreamDestination){var dest=audio.createMediaStreamDestination(); audio.master.connect(dest); dest.stream.getAudioTracks().forEach(function(t){stream.addTrack(t);});}
    var mime=['video/mp4','video/webm;codecs=vp9','video/webm'].filter(function(m){return MediaRecorder.isTypeSupported(m);})[0];
    rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined); chunks=[];
    rec.ondataavailable=function(e){if(e.data&&e.data.size) chunks.push(e.data);};
    rec.onstop=function(){
      var type=rec.mimeType||'video/webm', blob=new Blob(chunks,{type:type}), url=URL.createObjectURL(blob);
      var out=document.getElementById('out'); out.src=url; out.style.display='block';
      var a=document.createElement('a'); a.href=url; a.download='dohled.'+(type.indexOf('mp4')>-1?'mp4':'webm'); document.body.appendChild(a); a.click(); a.remove();
      b.textContent='● Vytvořit video'; say('Video vytvořeno. Najdeš ho v panelu vpravo.');
    };
    rec.start(1000); b.textContent='■ Zastavit a uložit'; say('Nahrávám výstup…');
  }catch(e){say('Vytvoření videa selhalo.');}
}
document.querySelector('.screen').addEventListener('click',function(){if(video&&video.paused){var p=video.play(); if(p&&p.catch) p.catch(function(){});}});

/* AI MODEL NA POZADÍ */
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error(src));};document.head.appendChild(s);});}
loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0')
  .then(function(){return loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3');})
  .then(function(){return cocoSsd.load({base:'lite_mobilenet_v2'});})
  .then(function(m){model=m; statusEl.textContent='● AI modul připraven. Nahraj materiál.';})
  .catch(function(){model=null; statusEl.textContent='AI modul nedostupný – běží záložní detekce pohybu.';});
</script>
</body>
</html>
