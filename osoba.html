<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOHLED // ŠPIONÁŽNÍ TERMINÁL</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#050805;color:#39ff6a;font-family:"Courier New",monospace;min-height:100vh}
  header{padding:14px 18px;border-bottom:1px solid #1d4d2a;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  h1{margin:0;font-size:18px;letter-spacing:4px;text-shadow:0 0 8px #39ff6a}
  .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-block;background:#0b1d10;color:#39ff6a;border:1px solid #39ff6a;padding:12px 14px;font:inherit;cursor:pointer;letter-spacing:2px;text-transform:uppercase;font-size:12px;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .btn:active{background:#39ff6a;color:#000}
  .btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
  main{display:grid;grid-template-columns:1fr 280px;gap:14px;padding:14px}
  @media(max-width:850px){main{grid-template-columns:1fr}}
  .screen{position:relative;border:1px solid #1d4d2a;background:#000;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{max-width:100%;max-height:75vh;display:block}
  .scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
  .vig{pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 100px rgba(0,0,0,.7)}
  #caption{pointer-events:none;position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.92));color:#ff3b3b;font-size:clamp(14px,2.2vw,22px);font-weight:bold;letter-spacing:2px;text-shadow:0 0 10px red;min-height:60px}
  #placeholder{position:absolute;text-align:center;opacity:.7;letter-spacing:3px;line-height:2;pointer-events:none}
  #exitfs{display:none;position:absolute;top:10px;right:10px;z-index:5;background:rgba(0,0,0,.7);color:#39ff6a;border:1px solid #39ff6a;font:inherit;font-size:18px;padding:6px 12px;cursor:pointer}
  .screen.pfs{position:fixed;inset:0;z-index:999;border:0;background:#000;min-height:0}
  .screen.pfs canvas,.screen:fullscreen canvas{width:100vw;height:100vh;max-width:none;max-height:none;object-fit:contain}
  .screen:fullscreen{background:#000;border:0}
  .screen.pfs #exitfs,.screen:fullscreen #exitfs{display:block}
  aside{border:1px solid #1d4d2a;padding:12px;background:#030a04;display:flex;flex-direction:column;gap:10px}
  aside h2{margin:0;font-size:13px;letter-spacing:3px;border-bottom:1px solid #1d4d2a;padding-bottom:6px}
  #log{font-size:12px;line-height:1.6;overflow-y:auto;max-height:45vh}
  #log div{border-left:2px solid #39ff6a;padding-left:8px;margin-bottom:6px}
  #log div.warn{border-color:#ff3b3b;color:#ff7070}
  #status{font-size:12px;color:#ffd24a}
  #out{width:100%;display:none;background:#000}
</style>
</head>
<body>
<header>
  <h1>◉ DOHLED // TAJNÝ TERMINÁL</h1>
  <div class="btns">
    <label class="btn">Nahrát video / foto<input type="file" id="file" accept="video/*,image/*"></label>
    <button class="btn" id="snd" type="button" onclick="toggleSound()">Zvuk: ZAP</button>
    <button class="btn" id="mode" type="button" onclick="toggleMode()">Režim: OZNAČIT</button>
    <button class="btn" type="button" onclick="toggleFull()">⛶ Celá obrazovka</button>
    <button class="btn" id="rec" type="button" onclick="toggleRec()">● Vytvořit video</button>
  </div>
</header>
<main>
  <div class="screen" id="scr">
    <div id="placeholder">[ ČEKÁM NA VSTUPNÍ MATERIÁL ]<br>NAHRAJ VIDEO NEBO FOTOGRAFII</div>
    <canvas id="cv" width="640" height="360"></canvas>
    <div class="scan"></div><div class="vig"></div>
    <div id="caption"></div>
    <button id="exitfs" type="button" onclick="event.stopPropagation();exitFull()">✕</button>
  </div>
  <aside>
    <h2>PROTOKOL UDÁLOSTÍ</h2>
    <div id="status">Načítám AI moduly na pozadí…</div>
    <div id="log"></div>
    <video id="out" controls playsinline></video>
  </aside>
</main>

<script>
var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), capEl=document.getElementById('caption'),
    logEl=document.getElementById('log'), statusEl=document.getElementById('status'), scr=document.getElementById('scr');
window.onerror=function(m){statusEl.textContent='Chyba: '+m;};

var CZ={cup:'hrníček',bottle:'láhev','wine glass':'sklenici','cell phone':'telefon',laptop:'notebook',book:'knihu',
  knife:'nůž',scissors:'nůžky',backpack:'batoh',handbag:'kabelku',umbrella:'deštník',remote:'ovladač',
  keyboard:'klávesnici',mouse:'myš',fork:'vidličku',spoon:'lžíci',bowl:'misku',toothbrush:'kartáček',suitcase:'kufr'};

var model=null, seg=null, video=null, running=false, busy=false, segBusy=false, lastDet=0, tick=0;
var persons=[], holding={}, personPresent=false, absent=0, blackMode=false;
var audio=null, soundOn=true, drone=null, clickBuf=null, silentEl=null;

/* maska skutečné osoby */
var maskC=document.createElement('canvas'); maskC.width=1; maskC.height=1;
var mctx=maskC.getContext('2d'), maskBox=null, motionBox=null;
/* záložní detekce pohybu */
var MW=96, MH=54, bg=null;
var sm=document.createElement('canvas'); sm.width=MW; sm.height=MH;
var sctx=sm.getContext('2d');

/* ---------- ZVUK ---------- */
function unlockIOS(){
  if(silentEl) return;
  try{
    silentEl=document.createElement('audio'); silentEl.setAttribute('playsinline','');
    silentEl.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    silentEl.loop=true; var p=silentEl.play(); if(p&&p.catch) p.catch(function(){});
  }catch(e){}
}
function initAudio(){
  unlockIOS();
  if(audio){ if(audio.state==='suspended') audio.resume(); return; }
  try{
    audio=new (window.AudioContext||window.webkitAudioContext)();
    var master=audio.createGain(); master.gain.value=.9; master.connect(audio.destination); audio.master=master;
    var len=Math.floor(audio.sampleRate*.03); clickBuf=audio.createBuffer(1,len,audio.sampleRate);
    var d=clickBuf.getChannelData(0); for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    drone=audio.createGain(); drone.gain.value=soundOn?.09:0; drone.connect(master);
    var lp=audio.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; lp.connect(drone);
    [55,55.7,82.4].forEach(function(f){var o=audio.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.connect(lp); o.start();});
    var lfo=audio.createOscillator(), lg=audio.createGain(); lfo.frequency.value=.12; lg.gain.value=90; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    if(audio.state==='suspended') audio.resume();
  }catch(e){audio=null;}
}
['pointerdown','touchend','click','keydown'].forEach(function(ev){document.addEventListener(ev,initAudio,{passive:true});});

function blip(){ /* psací stroj + morseovka při každém písmenu */
  if(!audio||!soundOn||!clickBuf) return;
  try{
    var t=audio.currentTime;
    var n=audio.createBufferSource(); n.buffer=clickBuf;
    var hp=audio.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1800;
    var ng=audio.createGain(); ng.gain.value=.8; n.connect(hp); hp.connect(ng); ng.connect(audio.master); n.start(t);
    var o=audio.createOscillator(), og=audio.createGain();
    o.type='square'; o.frequency.value=1100+Math.random()*500;
    og.gain.setValueAtTime(.1,t); og.gain.exponentialRampToValueAtTime(.001,t+.05);
    o.connect(og); og.connect(audio.master); o.start(t); o.stop(t+.06);
  }catch(e){}
}
function ping(t,v){ /* sonar s ozvěnou */
  [[0,v],[.3,v*.35]].forEach(function(p){
    var o=audio.createOscillator(), g=audio.createGain(), s=t+p[0];
    o.type='sine'; o.frequency.setValueAtTime(1500,s); o.frequency.exponentialRampToValueAtTime(1400,s+1.1);
    g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(p[1],s+.01); g.gain.exponentialRampToValueAtTime(.001,s+1.1);
    o.connect(g); g.connect(audio.master); o.start(s); o.stop(s+1.2);
  });
}
function sting(kind){
  if(!audio||!soundOn) return;
  try{
    var t=audio.currentTime;
    if(kind==='alert'){
      var g=audio.createGain();
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.5,t+.05); g.gain.exponentialRampToValueAtTime(.001,t+1.8);
      g.connect(audio.master);
      [520,520*1.0595,520*1.41].forEach(function(f,i){
        var o=audio.createOscillator(); o.type=i?'triangle':'sine';
        o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.55,t+1.6);
        var tr=audio.createOscillator(), tg=audio.createGain(); tr.frequency.value=7+i*2; tg.gain.value=25; tr.connect(tg); tg.connect(o.frequency);
        o.connect(g); o.start(t); tr.start(t); o.stop(t+1.9); tr.stop(t+1.9);
      });
      var lo=audio.createOscillator(), lg=audio.createGain();
      lo.type='sine'; lo.frequency.setValueAtTime(90,t); lo.frequency.exponentialRampToValueAtTime(40,t+.8);
      lg.gain.setValueAtTime(.9,t); lg.gain.exponentialRampToValueAtTime(.001,t+.9);
      lo.connect(lg); lg.connect(audio.master); lo.start(t); lo.stop(t+1);
      ping(t+.1,.35);
    } else ping(t,.18);
  }catch(e){}
}
function toggleSound(){
  initAudio(); soundOn=!soundOn;
  if(drone) drone.gain.value=soundOn?.09:0;
  document.getElementById('snd').textContent='Zvuk: '+(soundOn?'ZAP':'VYP');
  if(soundOn) sting('alert');
}

/* ---------- TITULKY ---------- */
var typeTimer=null, lastSay='', lastSayT=0;
function say(text,level){
  var now=Date.now(); if(text===lastSay&&now-lastSayT<4000) return;
  lastSay=text; lastSayT=now;
  var row=document.createElement('div'); if(level==='alert') row.className='warn';
  row.textContent='['+new Date().toLocaleTimeString('cs-CZ')+'] '+text;
  logEl.insertBefore(row,logEl.firstChild); while(logEl.children.length>40) logEl.removeChild(logEl.lastChild);
  clearInterval(typeTimer); var i=0, full='▶ '+text.toUpperCase();
  sting(level);
  typeTimer=setInterval(function(){
    i++; capEl.textContent=full.slice(0,i)+'█';
    if(full.charAt(i-1)!==' ') blip();
    if(i>=full.length){clearInterval(typeTimer);capEl.textContent=full;}
  },50);
}

/* ---------- REŽIM A CELÁ OBRAZOVKA ---------- */
function toggleMode(){
  blackMode=!blackMode;
  document.getElementById('mode').textContent='Režim: '+(blackMode?'ZČERNIT':'OZNAČIT');
}
function isFull(){return document.fullscreenElement||document.webkitFullscreenElement||scr.classList.contains('pfs');}
function exitFull(){
  scr.classList.remove('pfs');
  if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen();
  else if(document.webkitFullscreenElement&&document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleFull(){
  if(isFull()){exitFull();return;}
  var rq=scr.requestFullscreen||scr.webkitRequestFullscreen;
  if(rq){
    try{var p=rq.call(scr); if(p&&p.catch) p.catch(function(){scr.classList.add('pfs');});}
    catch(e){scr.classList.add('pfs');}
  } else scr.classList.add('pfs');
}

/* ---------- MASKA SKUTEČNÉ OSOBY ---------- */
function buildMask(data,w,h){
  if(maskC.width!==w||maskC.height!==h){maskC.width=w; maskC.height=h;}
  var im=mctx.createImageData(w,h), px=im.data, minX=w,minY=h,maxX=-1,maxY=-1,cnt=0,i,x,y,o,edge;
  for(i=0;i<data.length;i++){
    if(!data[i]) continue;
    cnt++; x=i%w; y=(i/w)|0;
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
    o=i*4;
    if(blackMode){px[o+3]=255;}
    else{
      edge=x<2||y<2||x>w-3||y>h-3||!data[i-2]||!data[i+2]||!data[i-2*w]||!data[i+2*w];
      px[o]=255; px[o+1]=edge?90:30; px[o+2]=edge?90:30; px[o+3]=edge?255:95;
    }
  }
  mctx.putImageData(im,0,0);
  if(cnt>w*h*.004) maskBox=[minX/w*cv.width,minY/h*cv.height,(maxX-minX+1)/w*cv.width,(maxY-minY+1)/h*cv.height];
  else maskBox=null;
  if(!model) presence(!!maskBox);
}
function presence(has){
  if(has){
    absent=0;
    if(!personPresent){personPresent=true; say('Osoba vstoupila do záběru','alert');}
  } else if(personPresent&&++absent>8){personPresent=false; holding={}; say('Osoba opustila záběr. Sleduji dál…');}
}

/* ---------- LOGIKA (předměty) ---------- */
function inside(o,b){var cx=o.bbox[0]+o.bbox[2]/2, cy=o.bbox[1]+o.bbox[3]/2, m=20;
  return cx>b[0]-m&&cx<b[0]+b[2]+m&&cy>b[1]-m&&cy<b[1]+b[3]+m;}
function analyze(preds,isVideo){
  persons=preds.filter(function(p){return p.class==='person'&&p.score>.45;});
  var objs=preds.filter(function(p){return p.class!=='person'&&p.score>.4;});
  if(persons.length){
    absent=0;
    if(!personPresent){personPresent=true; say(persons.length>1?'V záběru je '+persons.length+' osob':'Osoba vstoupila do záběru','alert');}
  } else if(personPresent&&isVideo&&++absent>8){personPresent=false; holding={}; say('Osoba opustila záběr. Sleduji dál…');}
  if(!persons.length) return;
  var p=persons.reduce(function(a,b){return a.bbox[2]*a.bbox[3]>b.bbox[2]*b.bbox[3]?a:b;});
  var near={}; objs.forEach(function(o){if(inside(o,p.bbox)&&CZ[o.class]) near[o.class]=true;});
  if(!isVideo){
    var n=Object.keys(near).map(function(k){return CZ[k];});
    say(n.length?'Osoba je v kontaktu s předmětem: '+n.join(', '):'Osoba zachycena. Žádný podezřelý předmět.','alert'); return;
  }
  for(var k in near){holding[k]=holding[k]||{n:0,on:false}; holding[k].n++;
    if(holding[k].n>=3&&!holding[k].on){holding[k].on=true; say('Osoba si vzala '+CZ[k],'alert');}}
  for(var k2 in holding){if(!near[k2]){holding[k2].n--; if(holding[k2].n<=-3){if(holding[k2].on) say('Osoba odložila '+CZ[k2]); delete holding[k2];}}}
}

/* ZÁLOŽNÍ DETEKCE POHYBU (když AI není k dispozici) – jen rámeček */
function detectMotion(src){
  sctx.drawImage(src,0,0,MW,MH);
  var d=sctx.getImageData(0,0,MW,MH).data, n=MW*MH, cur=new Float32Array(n), i, cnt=0;
  var minX=MW,minY=MH,maxX=0,maxY=0;
  for(i=0;i<n;i++) cur[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
  if(!bg){bg=new Float32Array(cur); return;}
  for(i=0;i<n;i++){
    if(Math.abs(cur[i]-bg[i])>30){cnt++; var x=i%MW, y=(i/MW)|0; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;}
    bg[i]=bg[i]*.96+cur[i]*.04;
  }
  if(cnt>40){
    var sx=cv.width/MW, sy=cv.height/MH;
    motionBox=[minX*sx,minY*sy,(maxX-minX+1)*sx,(maxY-minY+1)*sy];
  } else motionBox=null;
  presence(!!motionBox);
}

/* ---------- VYKRESLENÍ ---------- */
function marker(b,i,label){
  var x=b[0],y=b[1],w=b[2],h=b[3];
  ctx.strokeStyle='#ff2b2b'; ctx.lineWidth=2; ctx.setLineDash([8,5]); ctx.strokeRect(x-6,y-6,w+12,h+12); ctx.setLineDash([]);
  ctx.fillStyle='#ff2b2b'; ctx.font='bold 14px Courier New';
  ctx.fillText(label||('SUBJEKT #'+(i+1)+' // NEZNÁMÝ'),x-6,Math.max(14,y-12));
}
function hud(isVideo){
  var t=new Date(); ctx.font='bold 15px Courier New'; ctx.fillStyle='#39ff6a';
  ctx.fillText(t.toLocaleDateString('cs-CZ')+' '+t.toLocaleTimeString('cs-CZ'),14,24);
  ctx.fillText('KAM-07 // NOČNÍ REŽIM',14,44);
  if(isVideo&&Math.floor(t.getTime()/600)%2===0){ctx.fillStyle='#ff2b2b';ctx.beginPath();ctx.arc(cv.width-90,20,7,0,7);ctx.fill();ctx.fillText('REC',cv.width-76,26);}
  ctx.strokeStyle='#39ff6a'; ctx.lineWidth=2;
  [[10,10,1,1],[cv.width-10,10,-1,1],[10,cv.height-10,1,-1],[cv.width-10,cv.height-10,-1,-1]].forEach(function(a){
    ctx.beginPath();ctx.moveTo(a[0],a[1]+28*a[3]);ctx.lineTo(a[0],a[1]);ctx.lineTo(a[0]+28*a[2],a[1]);ctx.stroke();});
}
function render(src,isVideo){
  ctx.drawImage(src,0,0,cv.width,cv.height);
  ctx.fillStyle='rgba(0,40,10,.10)'; ctx.fillRect(0,0,cv.width,cv.height);
  if(maskBox){
    ctx.save(); if(!blackMode){ctx.shadowColor='#ff2b2b'; ctx.shadowBlur=14;}
    ctx.drawImage(maskC,0,0,cv.width,cv.height); ctx.restore();
    marker(maskBox,0);
  } else if(persons.length){
    persons.forEach(function(p,i){marker(p.bbox,i);});
  } else if(!seg&&!model&&motionBox){
    marker(motionBox,0,'POHYB // MOŽNÝ SUBJEKT');
  }
  hud(isVideo);
}

/* ---------- SMYČKA ---------- */
function loop(){
  if(!running) return;
  var now=performance.now();
  if(!video.paused&&!video.ended&&now-lastDet>150){
    lastDet=now; tick++;
    if(seg&&!segBusy&&(!model||tick%2)){
      segBusy=true;
      seg.segmentPerson(video,{internalResolution:'medium',segmentationThreshold:.55})
        .then(function(r){buildMask(r.data,r.width,r.height); segBusy=false;})
        .catch(function(){segBusy=false;});
    } else if(model&&!busy){
      busy=true;
      model.detect(video).then(function(p){analyze(p,true);busy=false;}).catch(function(){busy=false;});
    }
    if(!seg&&!model) detectMotion(video);
  }
  render(video,true);
  requestAnimationFrame(loop);
}

/* ---------- NAHRÁVÁNÍ SOUBORU ---------- */
function aiStatus(){
  statusEl.textContent = seg ? '● AI připravena: označuje skutečné osoby.'
    : model ? '● AI připravena (rámečky kolem osob).'
    : 'AI nedostupná – označuje se jen pohyb (otevři jako soubor .html s internetem).';
}
document.getElementById('file').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f) return;
  initAudio();
  running=false; persons=[]; holding={}; personPresent=false; absent=0; bg=null; maskBox=null; motionBox=null; mctx.clearRect(0,0,maskC.width,maskC.height);
  if(video&&video.parentNode) video.parentNode.removeChild(video);
  document.getElementById('placeholder').style.display='none'; capEl.textContent='';
  var url=URL.createObjectURL(f);
  if(f.type.indexOf('image/')===0){
    var img=new Image();
    img.onload=function(){
      cv.width=img.naturalWidth; cv.height=img.naturalHeight;
      var jobs=[];
      if(seg) jobs.push(seg.segmentPerson(img,{internalResolution:'high',segmentationThreshold:.55}).then(function(r){buildMask(r.data,r.width,r.height);}));
      if(model) jobs.push(model.detect(img).then(function(p){analyze(p,false);}));
      if(!jobs.length){say('Snímek přijat. AI není dostupná – osobu u fotky nelze označit.'); render(img,false); return;}
      Promise.all(jobs.map(function(j){return j.catch(function(){});})).then(function(){
        if(!model&&maskBox) say('Osoba zachycena na snímku.','alert');
        render(img,false);
      });
    }; img.src=url;
  } else {
    video=document.createElement('video'); video.muted=true; video.loop=true; video.preload='auto';
    video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
    video.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none';
    document.body.appendChild(video);
    var started=false, v=video;
    var start=function(){
      if(started||!v.videoWidth) return; started=true;
      var s=Math.min(1,960/v.videoWidth);
      cv.width=Math.round(v.videoWidth*s); cv.height=Math.round(v.videoHeight*s);
      var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){say('Klepni na obrazovku pro spuštění videa.');});
      running=true; aiStatus();
      say('Záznam spuštěn. Sleduji.'); loop();
    };
    v.addEventListener('loadedmetadata',start); v.addEventListener('loadeddata',start); v.addEventListener('canplay',start);
    v.addEventListener('error',function(){say('Video se nepodařilo načíst. Zkus formát MP4.');});
    v.src=url; v.load();
  }
  e.target.value='';
});

/* ---------- VYTVOŘENÍ VIDEA ---------- */
var rec=null, chunks=[];
function toggleRec(){
  var b=document.getElementById('rec');
  if(rec&&rec.state==='recording'){rec.stop();return;}
  if(!running){say('Nejdřív nahraj video.');return;}
  if(!cv.captureStream||!window.MediaRecorder){say('Tohle zařízení neumí vytvořit video z výstupu.');return;}
  try{
    initAudio();
    var stream=cv.captureStream(30);
    if(audio&&audio.createMediaStreamDestination){var dest=audio.createMediaStreamDestination(); audio.master.connect(dest); dest.stream.getAudioTracks().forEach(function(t){stream.addTrack(t);});}
    var mime=['video/mp4','video/webm;codecs=vp9','video/webm'].filter(function(m){return MediaRecorder.isTypeSupported(m);})[0];
    rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined); chunks=[];
    rec.ondataavailable=function(e){if(e.data&&e.data.size) chunks.push(e.data);};
    rec.onstop=function(){
      var type=rec.mimeType||'video/webm', blob=new Blob(chunks,{type:type}), url=URL.createObjectURL(blob);
      var out=document.getElementById('out'); out.src=url; out.style.display='block';
      var a=document.createElement('a'); a.href=url; a.download='dohled.'+(type.indexOf('mp4')>-1?'mp4':'webm'); document.body.appendChild(a); a.click(); a.remove();
      b.textContent='● Vytvořit video'; say('Video vytvořeno. Najdeš ho v panelu vpravo.');
    };
    rec.start(1000); b.textContent='■ Zastavit a uložit'; say('Nahrávám výstup…');
  }catch(e){say('Vytvoření videa selhalo.');}
}
