<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detektor nebezpečných předmětů</title>
<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#111;color:#eee}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,label.btn{background:#2f7df6;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer}
input[type=file]{display:none}
#status{padding:14px;border-radius:10px;font-size:1.1rem;font-weight:600;background:#333;margin-bottom:14px}
#status.ok{background:#1e6b3a}
#status.bad{background:#b3261e}
canvas{width:100%;border-radius:10px;background:#000}
video{display:none}
small{color:#aaa}
</style>
</head>
<body>
<main>
  <h1>🔍 Detektor nebezpečných předmětů</h1>
  <div class="row">
    <label class="btn">📷 Fotka<input type="file" id="fi" accept="image/*"></label>
    <label class="btn">🎞 Video<input type="file" id="fv" accept="video/*"></label>
    <button id="cam">📹 Kamera</button>
    <button id="stp" style="background:#555">Stop</button>
  </div>
  <div id="status">Načítám model…</div>
  <canvas id="c" width="640" height="360"></canvas>
  <video id="v" muted playsinline></video>
  <p><small>Hledá: nůž, nůžky a baseballovou pálku. Rozpoznávání není stoprocentní, ber ho jen jako pomůcku.</small></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script>
var DANGER = {"knife":"nůž", "scissors":"nůžky", "baseball bat":"baseballová pálka"};
var model = null, running = false, stream = null;
var video = document.getElementById('v');
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var statusEl = document.getElementById('status');

cocoSsd.load().then(function(m){
  model = m;
  setStatus("Model je připraven. Vyber fotku, video nebo kameru.", "");
}).catch(function(){
  setStatus("Model se nepodařilo načíst. Zkontroluj připojení k internetu.", "bad");
});

function setStatus(text, cls){
  statusEl.textContent = text;
  statusEl.className = cls;
}

function stopAll(){
  running = false;
  video.pause();
  if (stream){
    stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null;
  }
  video.srcObject = null;
}

function draw(preds){
  var found = [];
  preds.forEach(function(p){
    var czName = DANGER[p.class];
    var color = czName ? "#ff3b30" : "#34c759";
    var b = p.bbox;
    ctx.lineWidth = 3;
    ctx.strokeStyle = color;
    ctx.strokeRect(b[0], b[1], b[2], b[3]);
    var label = (czName || p.class) + " " + Math.round(p.score*100) + " %";
    ctx.font = "bold 16px Arial";
    var w = ctx.measureText(label).width + 8;
    ctx.fillStyle = color;
    ctx.fillRect(b[0], Math.max(0, b[1]-22), w, 22);
    ctx.fillStyle = "#fff";
    ctx.fillText(label, b[0]+4, Math.max(16, b[1]-6));
    if (czName && found.indexOf(czName) === -1) found.push(czName);
  });
  if (found.length){
    setStatus("⚠️ Nalezen nebezpečný předmět: " + found.join(", "), "bad");
  } else if (preds.length){
    setStatus("✅ Žádný nebezpečný předmět nenalezen.", "ok");
  } else {
    setStatus("Nic jsem nerozpoznal.", "");
  }
}

function needModel(){
  if (!model){ setStatus("Model se ještě načítá…", ""); return false; }
  return true;
}

document.getElementById('fi').onchange = function(e){
  var f = e.target.files[0];
  if (!f || !needModel()) return;
  stopAll();
  var img = new Image();
  img.onload = function(){
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    ctx.drawImage(img, 0, 0);
    model.detect(img).then(draw);
  };
  img.src = URL.createObjectURL(f);
};

function loop(){
  if (!running) return;
  if (video.videoWidth){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    model.detect(video).then(function(preds){
      if (!running) return;
      draw(preds);
      requestAnimationFrame(loop);
    });
  } else {
    requestAnimationFrame(loop);
  }
}

document.getElementById('fv').onchange = function(e){
  var f = e.target.files[0];
  if (!f || !needModel()) return;
  stopAll();
  video.src = URL.createObjectURL(f);
  video.loop = true;
  video.play();
  running = true;
  loop();
};

document.getElementById('cam').onclick = function(){
  if (!needModel()) return;
  stopAll();
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
    stream = s;
    video.srcObject = s;
    video.play();
    running = true;
    loop();
  }).catch(function(){
    setStatus("Kameru se nepodařilo spustit (zkontroluj oprávnění).", "bad");
  });
};

document.getElementById('stp').onclick = function(){
  stopAll();
  setStatus("Zastaveno.", "");
};
</script>
</body>
</html>
