<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hodnocení</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding: 40px 16px; margin: 0; }
  .card { background: #fff; max-width: 420px; width: 100%; padding: 28px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  h1 { margin-top: 0; font-size: 22px; }

  .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; margin: 12px 0; }
  .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .stars label { font-size: 48px; line-height: 1; color: #ccc; cursor: pointer; padding: 0 4px; }
  .stars input:checked ~ label,
  .stars label:hover,
  .stars label:hover ~ label { color: #f5b301; }

  textarea { width: 100%; box-sizing: border-box; height: 120px; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
  button { margin-top: 14px; width: 100%; padding: 12px; font-size: 16px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>Ohodnoťte nás</h1>

  <form action="mailto:ondra1685@gmail.com?subject=Nove%20hodnoceni" method="POST" enctype="text/plain">
    <div class="stars">
      <input type="radio" id="s5" name="hvezdicky" value="5 z 5" required><label for="s5" title="5">&#9733;</label>
      <input type="radio" id="s4" name="hvezdicky" value="4 z 5"><label for="s4" title="4">&#9733;</label>
      <input type="radio" id="s3" name="hvezdicky" value="3 z 5"><label for="s3" title="3">&#9733;</label>
      <input type="radio" id="s2" name="hvezdicky" value="2 z 5"><label for="s2" title="2">&#9733;</label>
      <input type="radio" id="s1" name="hvezdicky" value="1 z 5"><label for="s1" title="1">&#9733;</label>
    </div>

    <textarea name="komentar" placeholder="Napište komentář (nepovinné)..."></textarea>
    <button type="submit">Odeslat</button>
  </form>
</div>
</body>
</html>
