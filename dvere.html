<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zákazníci</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#dcdad2;--accent:#b45309;--accent-text:#fff;--ok:#15803d;--warn:#b91c1c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--text:#f1f0ea;--muted:#a3a29a;--line:#3a3a36;--accent:#f59e0b;--accent-text:#1a1200;--ok:#4ade80;--warn:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--text:#f1f0ea;--muted:#a3a29a;--line:#3a3a36;--accent:#f59e0b;--accent-text:#1a1200;--ok:#4ade80;--warn:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=tel]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.row{display:flex;gap:10px;margin-bottom:12px}
.row>div{flex:1}
.row>div.small{flex:0 0 110px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 14px;display:block;width:100%;text-align:center;margin:0}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;margin:0;font-size:inherit;color:inherit}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:flex;gap:6px}
.seg button{padding:10px 12px;width:auto}
.seg button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.status{font-size:.9rem;min-height:1.3em;margin-top:8px}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .info{flex:1;min-width:0}
li .name{word-break:break-word}
li .phone{font-size:.9rem;color:var(--muted)}
li .phone a{color:var(--accent)}
li .num{font-weight:700;font-size:1.2rem;min-width:2.5ch;text-align:right}
li .num small{font-weight:400;color:var(--muted);font-size:.8rem}
li button{padding:8px 10px;color:var(--warn);width:auto}
.empty{color:var(--muted);text-align:center;padding:16px 0}
.sum{color:var(--muted);font-size:.9rem;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Zákazníci</h1>

<div class="card">
  <div class="row">
    <div><label for="name">Jméno zákazníka</label><input type="text" id="name" autocomplete="off"></div>
    <div class="small"><label for="doors">Počet dveří</label><input type="number" id="doors" min="1" step="1" inputmode="numeric"></div>
  </div>
  <div style="margin-bottom:12px">
    <label for="phone">Telefon (nepovinné)</label>
    <input type="tel" id="phone" autocomplete="off" inputmode="tel">
  </div>
  <button class="primary" id="add">Přidat</button>
  <div class="status" id="msg"></div>
</div>

<div class="card">
  <label class="toggle" for="auto"><span>Ukládat automaticky</span><input type="checkbox" id="auto"></label>
  <button id="save" style="margin-top:6px">Uložit</button>
  <div class="status" id="saveStatus"></div>
  <button id="export" style="margin-top:10px">Stáhnout do souboru</button>
  <div class="status" id="fileMsg"></div>
</div>

<div class="card">
  <div class="bar">
    <strong>Seznam</strong>
    <div class="seg">
      <button id="desc">Nejvíc → nejméně</button>
      <button id="asc">Nejméně → nejvíc</button>
    </div>
  </div>
  <ul id="list"></ul>
  <div class="sum" id="sum"></div>
</div>
</main>

<script>
(function(){
  var KEY_DATA='dvere:data', KEY_SET='dvere:nastaveni';
  var items=[], sort='desc', auto=false, dirty=false, pendingDel=null, dbDoc=null, dl=null;
  var $=function(id){return document.getElementById(id)};

  function read(key){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
  function write(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); return true; }catch(e){ return false; } }

  function persist(){
    var okLocal=write(KEY_DATA,items);
    if(dbDoc){
      dbDoc.set({items:items}).then(function(){ dirty=false; renderStatus(); })
        .catch(function(){ if(okLocal) dirty=false; renderStatus('db'); });
    } else {
      if(okLocal) dirty=false;
      renderStatus(okLocal?null:'fail');
    }
  }
  function saveSettings(){ write(KEY_SET,{auto:auto,sort:sort}); }

  function renderStatus(err){
    var el=$('saveStatus');
    if(err==='db'){ el.textContent='Uloženo jen v tomto prohlížeči, na server se to nepovedlo.'; el.className='status warn'; return; }
    if(err){ el.textContent='Uložení se nepovedlo.'; el.className='status warn'; return; }
    if(dirty){ el.textContent='Neuložené změny – stiskni „Uložit“.'; el.className='status warn'; }
    else { el.textContent='Všechno je uložené.'; el.className='status ok'; }
  }

  function changed(){
    if(auto){ persist(); } else { dirty=true; renderStatus(); }
    render();
  }

  function render(){
    var sorted=items.slice().sort(function(a,b){
      return sort==='desc' ? b.doors-a.doors : a.doors-b.doors;
    });
    var ul=$('list'); ul.innerHTML='';
    if(!sorted.length){
      var e=document.createElement('div'); e.className='empty'; e.textContent='Zatím tu nic není.'; ul.appendChild(e);
    }
    sorted.forEach(function(it){
      var li=document.createElement('li');
      var info=document.createElement('div'); info.className='info';
      var n=document.createElement('div'); n.className='name'; n.textContent=it.name; info.appendChild(n);
      if(it.phone){
        var p=document.createElement('div'); p.className='phone';
        var digits=String(it.phone).replace(/[^0-9+]/g,'');
        if(digits){ var a=document.createElement('a'); a.href='tel:'+digits; a.textContent=it.phone; p.appendChild(a); }
        else { p.textContent=it.phone; }
        info.appendChild(p);
      }
      li.appendChild(info);
      var d=document.createElement('span'); d.className='num'; d.textContent=it.doors+' ';
      var s=document.createElement('small'); s.textContent='ks'; d.appendChild(s);
      li.appendChild(d);
      var x=document.createElement('button'); x.textContent=(pendingDel===it.id)?'Opravdu smazat?':'Smazat'; x.setAttribute('aria-label','Smazat '+it.name);
      x.onclick=function(){
        if(pendingDel!==it.id){
          pendingDel=it.id; render();
          setTimeout(function(){ if(pendingDel===it.id){ pendingDel=null; render(); } },4000);
          return;
        }
        pendingDel=null;
        items=items.filter(function(i){return i.id!==it.id});
        changed();
      };
      li.appendChild(x);
      ul.appendChild(li);
    });
    var total=items.reduce(function(a,i){return a+i.doors},0);
    $('sum').textContent=items.length?('Zákazníků: '+items.length+' · Dveří celkem: '+total):'';
    $('desc').className=sort==='desc'?'on':'';
    $('asc').className=sort==='asc'?'on':'';
  }

  function add(){
    var name=$('name').value.trim();
    var doors=parseInt($('doors').value,10);
    var phone=$('phone').value.trim();
    var m=$('msg');
    if(!name){ m.textContent='Napiš jméno zákazníka.'; m.className='status warn'; $('name').focus(); return; }
    if(!doors||doors<1){ m.textContent='Napiš počet dveří (aspoň 1).'; m.className='status warn'; $('doors').focus(); return; }
    var it={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),name:name,doors:doors};
    if(phone) it.phone=phone;
    items.push(it);
    $('name').value=''; $('doors').value=''; $('phone').value='';
    m.textContent=''; m.className='status';
    $('name').focus();
    changed();
  }

  function fileMsg(t,cls){ var el=$('fileMsg'); el.textContent=t; el.className='status '+(cls||''); }

  function exportFile(){
    var q=function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; };
    var rows=items.slice().sort(function(a,b){ return sort==='desc'?b.doors-a.doors:a.doors-b.doors; });
    var csv='\ufeff'+'Zákazník;Telefon;Počet dveří\n'+rows.map(function(i){return q(i.name)+';'+q(i.phone)+';'+i.doors}).join('\n');
    var fname='zakaznici.csv';
    if(dl){
      dl.save({filename:fname,data:csv})
        .then(function(){ fileMsg('Soubor je stažený.','ok'); })
        .catch(function(){ fileMsg('Stažení se nepovedlo nebo bylo zrušené.','warn'); });
      return;
    }
    try{
      var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },2000);
      fileMsg('Soubor je stažený.','ok');
    }catch(e){ fileMsg('Stažení se nepovedlo.','warn'); }
  }

  $('add').onclick=add;
  ['name','doors','phone'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  });
  $('save').onclick=persist;
  $('auto').onchange=function(){
    auto=this.checked; saveSettings();
    if(auto && dirty) persist(); else renderStatus();
  };
  $('desc').onclick=function(){ sort='desc'; saveSettings(); render(); };
  $('asc').onclick=function(){ sort='asc'; saveSettings(); render(); };
  $('export').onclick=exportFile;

  var st=read(KEY_SET); if(st){ auto=!!st.auto; if(st.sort==='asc'||st.sort==='desc') sort=st.sort; }
  var data=read(KEY_DATA); if(Array.isArray(data)) items=data;
  $('auto').checked=auto;
  render(); renderStatus();

  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(d){ if(d) dl=d; }).catch(function(){});
    window.claude.use('db').then(function(db){
      if(!db) return;
      var ref=db.doc('data/seznam');
      ref.get().then(function(snap){
        if(snap.exists && snap.data() && Array.isArray(snap.data().items)){
          items=snap.data().items; write(KEY_DATA,items); dirty=false;
        } else if(items.length){
          ref.set({items:items}).catch(function(){});
        }
        dbDoc=ref; render(); renderStatus();
      }).catch(function(){});
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
