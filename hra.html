<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kresli!</title>
<style>
:root{--bg:#f6f4ef;--fg:#222;--card:#fff;--ac:#e8512f;--mu:#777;--bd:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c1a;--fg:#eee;--card:#2a2926;--mu:#aaa;--bd:#444}}
:root[data-theme="dark"]{--bg:#1d1c1a;--fg:#eee;--card:#2a2926;--mu:#aaa;--bd:#444}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}
.s{display:none;max-width:720px;margin:0 auto;padding:16px}.s.on{display:block}
h1{font-size:2rem;margin:.3em 0}
input,select,button{font:inherit}
input[type=text],select{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);width:100%;margin:6px 0}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.mu{color:var(--mu)}
#code{font-size:3rem;letter-spacing:.2em;font-weight:700}
#prompt{font-size:1.3rem;font-weight:700;text-align:center;padding:8px}
#timer{text-align:center;color:var(--mu)}
#bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd);margin-bottom:8px}
#bar #prompt{flex:1;padding:0;text-align:left;font-size:1.1rem}
#bar #end{white-space:nowrap;margin:0}
canvas{width:100%;background:#fff;border:1px solid var(--bd);border-radius:8px;touch-action:none;display:block}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);padding:0;margin:0}
.sw.on{outline:3px solid var(--ac)}
label{display:block;margin:6px 0}
input[type=range]{width:100%}
#s-black{position:fixed;inset:0;background:#000;color:#999;max-width:none;text-align:center}
#s-black.on{display:flex;align-items:center;justify-content:center}
.stars{font-size:2.6rem;text-align:center;letter-spacing:.1em}
.stars span{cursor:pointer;color:var(--bd)}.stars span.h{color:#f5b301}
.rate img,.rank img{width:100%;border-radius:8px;border:1px solid var(--bd);background:#fff}
.rank{display:flex;gap:12px;align-items:center}.rank img{width:140px}
.pos{font-size:2rem;font-weight:700;min-width:48px}
</style></head><body>

<div class="s on" id="s-home">
 <h1>🎨 Kresli!</h1>
 <p class="mu">Kreslící hra pro více hráčů. Nakresli zadání, ohodnoť ostatní.</p>
 <div class="card"><input type="text" id="name" placeholder="Tvoje přezdívka" maxlength="20">
  <label>Čas na kreslení
   <select id="secs"><option value="60">1 minuta</option><option value="90" selected>1,5 minuty</option><option value="120">2 minuty</option><option value="180">3 minuty</option></select></label>
  <button id="create">Vytvořit hru</button></div>
 <button id="toCode" class="g" style="width:100%">Zadat kód</button>
 <p id="err" style="color:#d33"></p>
</div>

<div class="s" id="s-code">
 <h1>Zadat kód</h1>
 <div class="card"><input type="text" id="joinCode" placeholder="Kód hry" maxlength="4" style="text-transform:uppercase">
  <button id="join">Připojit se</button><button id="back" class="g">Zpět</button></div>
 <p id="err2" style="color:#d33"></p>
</div>

<div class="s" id="s-lobby">
 <h1>Čekárna</h1>
 <div class="card" style="text-align:center"><div class="mu">Kód hry</div><div id="code"></div><div id="qr"></div></div>
 <div class="card"><b>Hráči:</b><div id="plist"></div></div>
 <button id="start" style="display:none">Začít hru</button>
 <p id="waitHost" class="mu">Čekáme, až hru spustí zakladatel…</p>
</div>

<div class="s" id="s-draw">
 <div id="bar"><div id="prompt"></div><div id="timer"></div><button id="end">Konec</button></div>
 <canvas id="cv" width="640" height="480"></canvas>
 <div class="pal" id="pal"></div>
 <label>Štětec: <span id="szv">8</span> px<input type="range" id="sz" min="1" max="60" value="8"></label>
 <label>Průhlednost / jas: <span id="opv">100</span> %<input type="range" id="op" min="5" max="100" value="100"></label>
 <button class="g" id="undo">↩ Zpět</button><button class="g" id="clear">Smazat vše</button>
</div>

<div class="s" id="s-black"><div id="blackmsg">Hotovo. Čekáme na ostatní…</div></div>

<div class="s" id="s-rate"><h1>Hodnoť</h1><div id="rateBox" class="rate"></div>
 <button id="showRes" class="g" style="display:none">Ukončit hodnocení a ukázat pořadí</button></div>

<div class="s" id="s-res"><h1>🏆 Pořadí</h1><div id="resBox"></div><button id="again">Nová hra</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const PROMPTS=["Kočka v klobouku","Dům na kopci","Létající pes","Zmrzlinový pohár","Robot na procházce","Pirátská loď","Sněhulák v létě","Drak vařící večeři","Kolo s trojúhelníkovými koly","Strom plný ovoce","Vesmírná raketa","Ryba na kole","Hrad v oblacích","Příšera pod postelí","Pizza se zvláštní příchutí","Medvěd na bruslích"];
const COLORS=["#000000","#ffffff","#e8512f","#f5b301","#2e9e44","#1f78d1","#7b3fc4","#e65aa5","#8b5a2b","#9aa0a6"];
let db,uid,code,game=null,players={},drawings={},votes={},name="",host=false;
let started=false,submitted=false,tick=null,unsubs=[];
const show=id=>{document.querySelectorAll(".s").forEach(e=>e.classList.remove("on"));$("#"+id).classList.add("on")};
const err=m=>{$("#err").textContent=m;$("#err2").textContent=m};
$("#toCode").onclick=()=>{if(getName()){err("");show("s-code")}};
$("#back").onclick=()=>{err("");show("s-home")};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

(async()=>{
 try{const u=await claude.use("user");uid=u?(await u.id())+"-"+Math.random().toString(36).slice(2,7):null;db=await claude.use("db")}catch(e){}
 if(!db||!uid){err("Hra potřebuje přihlášení přes claude.ai a přístup k datům.");return}
 const h=location.hash.replace("#","").toUpperCase();if(h.length===4)$("#joinCode").value=h;
})();

function newCode(){const a="ABCDEFGHJKLMNPRSTUVXYZ";let c="";for(let i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
window.onunhandledrejection=e=>err("Chyba: "+((e.reason&&e.reason.message)||e.reason));
function getName(){if(!db){err("Hra se nepřipojila k datům. Otevři ji přihlášený na claude.ai a obnov stránku.");return false}name=$("#name").value.trim();if(!name){err("Zadej přezdívku.");return false}return true}

$("#create").onclick=async()=>{
 if(!db||!getName())return;
 code=newCode();host=true;
 await db.doc("games/"+code).set({host:uid,phase:"lobby",secs:+$("#secs").value});
 await enter();
};
$("#join").onclick=async()=>{
 if(!db||!getName())return;
 code=$("#joinCode").value.trim().toUpperCase();
 const g=await db.doc("games/"+code).get();
 if(!g.exists){err("Hra s tímto kódem neexistuje.");return}
 if(g.data().phase!=="lobby"){err("Hra už běží.");return}
 host=g.data().host===uid;await enter();
};
async function enter(){
 await db.doc(`games/${code}/players/${uid}`).set({name});
 unsubs.push(db.doc("games/"+code).onSnapshot(s=>{game=s.data();route()}));
 unsubs.push(db.collection(`games/${code}/players`).onSnapshot(q=>{players={};q.docs.forEach(d=>players[d.id]=d.data());route()}));
 unsubs.push(db.collection(`games/${code}/drawings`).onSnapshot(q=>{drawings={};q.docs.forEach(d=>drawings[d.id]=d.data());route()}));
 unsubs.push(db.collection(`games/${code}/votes`).onSnapshot(q=>{votes={};q.docs.forEach(d=>votes[d.id]=d.data());route()}));
 const url=location.href.split("#")[0]+"#"+code;
 try{const qr=qrcode(0,"M");qr.addData(url);qr.make();$("#qr").innerHTML=qr.createImgTag(5)}catch(e){}
 $("#code").textContent=code;
}

$("#start").onclick=()=>{
 const p=PROMPTS[Math.floor(Math.random()*PROMPTS.length)];
 db.doc("games/"+code).update({phase:"draw",prompt:p,endsAt:Date.now()+game.secs*1000});
};
$("#showRes").onclick=()=>db.doc("games/"+code).update({phase:"results"});
$("#again").onclick=()=>{unsubs.forEach(f=>f());location.hash="";location.reload()};

let hostBusy=false;
setInterval(()=>{
 if(!game||!host||hostBusy)return;
 const n=Object.keys(players).length,d=Object.keys(drawings).length;
 if(game.phase==="draw"&&(d>=n||Date.now()>game.endsAt+4000)&&d>0){hostBusy=true;db.doc("games/"+code).update({phase:"rate"}).finally(()=>hostBusy=false)}
 if(game.phase==="rate"){
  const need=Math.max(0,d-1);
  const done=Object.values(votes).filter(v=>Object.keys(v.r||{}).length>=need).length;
  if(done>=n&&n>0){hostBusy=true;db.doc("games/"+code).update({phase:"results"}).finally(()=>hostBusy=false)}
 }
},1000);

function route(){
 if(!game)return;
 if(game.phase==="lobby"){
  show("s-lobby");
  $("#plist").innerHTML=Object.values(players).map(p=>"<div>• "+esc(p.name)+"</div>").join("");
  $("#start").style.display=host?"inline-block":"none";$("#waitHost").style.display=host?"none":"block";
 }else if(game.phase==="draw"){
  if(!started){started=true;startDraw()}else if(submitted)show("s-black");
 }else if(game.phase==="rate"){
  if(!submitted&&started){submitted=true;clearInterval(tick);send()}
  renderRate();
 }else if(game.phase==="results"){renderRes()}
}

/* ---------- kreslení ---------- */
const cv=$("#cv"),ctx=cv.getContext("2d");
let color=COLORS[0],drawing=false,pts=[],base=document.createElement("canvas"),stack=[];
base.width=640;base.height=480;
function startDraw(){
 show("s-draw");$("#prompt").textContent="Nakresli: "+game.prompt;
 ctx.fillStyle="#fff";ctx.fillRect(0,0,640,480);
 $("#pal").innerHTML="";
 COLORS.forEach(c=>{const b=document.createElement("button");b.className="sw"+(c===color?" on":"");b.style.background=c;b.onclick=()=>pick(c,b);$("#pal").appendChild(b)});
 const ci=document.createElement("input");ci.type="color";ci.oninput=()=>pick(ci.value,null);$("#pal").appendChild(ci);
 tick=setInterval(()=>{
  const l=Math.max(0,Math.ceil((game.endsAt-Date.now())/1000));
  $("#timer").textContent="Zbývá "+Math.floor(l/60)+":"+String(l%60).padStart(2,"0");
  if(l<=0)finish();
 },250);
}
function pick(c,b){color=c;document.querySelectorAll(".sw").forEach(e=>e.classList.remove("on"));if(b)b.classList.add("on")}
$("#sz").oninput=e=>$("#szv").textContent=e.target.value;
$("#op").oninput=e=>$("#opv").textContent=e.target.value;
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*480/r.height]};
function paint(){
 ctx.clearRect(0,0,640,480);ctx.drawImage(base,0,0);
 ctx.globalAlpha=$("#op").value/100;ctx.strokeStyle=color;ctx.fillStyle=color;
 ctx.lineWidth=+$("#sz").value;ctx.lineCap="round";ctx.lineJoin="round";
 if(pts.length===1){ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],ctx.lineWidth/2,0,7);ctx.fill()}
 else{ctx.beginPath();ctx.moveTo(...pts[0]);pts.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke()}
 ctx.globalAlpha=1;
}
cv.onpointerdown=e=>{
 if(submitted)return;cv.setPointerCapture(e.pointerId);drawing=true;
 stack.push(snap());if(stack.length>20)stack.shift();
 base.getContext("2d").clearRect(0,0,640,480);base.getContext("2d").drawImage(cv,0,0);
 pts=[pos(e)];paint();
};
cv.onpointermove=e=>{if(!drawing)return;pts.push(pos(e));paint()};
cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
function snap(){const c=document.createElement("canvas");c.width=640;c.height=480;c.getContext("2d").drawImage(cv,0,0);return c}
$("#undo").onclick=()=>{const s=stack.pop();if(s){ctx.clearRect(0,0,640,480);ctx.drawImage(s,0,0)}};
$("#clear").onclick=()=>{stack.push(snap());ctx.fillStyle="#fff";ctx.fillRect(0,0,640,480)};
$("#end").onclick=finish;
function finish(){
 if(submitted)return;submitted=true;clearInterval(tick);show("s-black");send();
}
function send(){
 db.doc(`games/${code}/drawings/${uid}`).set({name,img:cv.toDataURL("image/jpeg",0.7)}).catch(()=>{});
}

/* ---------- hodnocení ---------- */
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h};
function renderRate(){
 show("s-rate");
 const mine=(votes[uid]&&votes[uid].r)||{};
 const q=Object.keys(drawings).filter(id=>id!==uid).sort((a,b)=>hash(a+uid)-hash(b+uid));
 const next=q.find(id=>!(id in mine));
 $("#showRes").style.display=host?"inline-block":"none";
 const box=$("#rateBox");
 if(!next){box.innerHTML='<div class="card">Ohodnoceno '+Object.keys(mine).length+' z '+q.length+'. Čekáme na ostatní…</div>';return}
 if(box.dataset.cur===next)return;
 box.dataset.cur=next;
 box.innerHTML='<div class="mu">Obrázek '+(Object.keys(mine).length+1)+' z '+q.length+' · zadání: '+esc(game.prompt)+'</div><img src="'+drawings[next].img+'"><div class="stars" id="st">'+[1,2,3,4,5].map(i=>'<span data-i="'+i+'">★</span>').join("")+'</div>';
 const sp=[...box.querySelectorAll(".stars span")];
 sp.forEach(s=>{
  s.onmouseenter=()=>sp.forEach((x,k)=>x.classList.toggle("h",k<+s.dataset.i));
  s.onclick=()=>{
   const r={...mine,[next]:+s.dataset.i};
   box.dataset.cur="";votes[uid]={r};
   db.doc(`games/${code}/votes/${uid}`).set({r});renderRate();
  };
 });
}

/* ---------- výsledky ---------- */
function renderRes(){
 show("s-res");
 const rows=Object.keys(drawings).map(id=>{
  const v=Object.values(votes).map(x=>(x.r||{})[id]).filter(Boolean);
  return{id,n:v.length,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:0,d:drawings[id]};
 }).sort((a,b)=>b.avg-a.avg);
 $("#resBox").innerHTML=rows.map((r,i)=>'<div class="card rank"><div class="pos">'+(i+1)+'.</div><img src="'+r.d.img+'"><div><b>'+esc(r.d.name)+(r.id===uid?" (ty)":"")+'</b><br>'+(r.n?"★ "+r.avg.toFixed(2)+" ("+r.n+" hl.)":"bez hodnocení")+'</div></div>').join("");
}
</script></body></html>
