<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moje aplikace</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d23;--muted:#6b7280;--line:#d8dbe2;--accent:#2f5fd0;--accent-text:#fff;--warn:#b91c1c;--link:#0645ad;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1c1f27;--text:#f1f2f5;--muted:#9ca3af;--line:#303541;--accent:#7b9cff;--accent-text:#0b1220;--warn:#f87171;--link:#8ab4ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1c1f27;--text:#f1f2f5;--muted:#9ca3af;--line:#303541;--accent:#7b9cff;--accent-text:#0b1220;--warn:#f87171;--link:#8ab4ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 14px}
input{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#q{margin-bottom:14px}
#list{display:grid;gap:10px}
.app{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.main{padding:14px 14px 8px}
.main a{display:inline-block;font-size:1.05rem;font-weight:600;color:var(--link);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.main a:visited{color:var(--link)}
.main .nolink{font-size:1.05rem;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.main span{display:block;color:var(--muted);font-size:.9rem;margin-top:2px;overflow-wrap:anywhere}
.tools{display:flex;gap:8px;padding:0 14px 12px}
.tools button,.edit button{font:inherit;cursor:pointer;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.tools button.del{color:var(--warn)}
.edit{display:grid;gap:8px;padding:14px}
.edit .btns{display:flex;gap:8px}
.edit button.ok{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
#none{color:var(--muted);text-align:center;padding:20px 0;display:none}
.add{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.add h2{font-size:1.05rem;margin:0}
.add button{font:inherit;cursor:pointer;padding:14px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);font-weight:600}
#msg{font-size:.95rem;min-height:1.3em;margin:0}
#msg.err{color:var(--warn)}
#msg.ok{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Moje aplikace</h1>
  <input id="q" type="search" placeholder="Hledat podle názvu…" autocomplete="off">
  <div id="list"></div>
  <div id="none">Nic nenalezeno.</div>

  <div class="add">
    <h2>Přidat odkaz</h2>
    <input id="n" type="text" placeholder="Název" autocomplete="off">
    <input id="d" type="text" placeholder="Popis (nepovinné)" autocomplete="off">
    <input id="u" type="text" inputmode="url" placeholder="Adresa, např. https://…" autocomplete="off" autocapitalize="off">
    <button id="addBtn" type="button">Přidat</button>
    <p id="msg" role="status"></p>
  </div>
</main>

<script>
/* Stálé odkazy. Další přidáš jedním řádkem podle vzoru (id musí být jedinečné). */
var APPS=[
  {id:'a1',name:'Zákazníci',desc:'Seznam zákazníků a počet dveří',url:''},
  {id:'a2',name:'HTML náhled',desc:'Vlož HTML kód, uvidíš výsledek a rozbor',url:''},
  {id:'a3',name:'Útok kláves',desc:'Hra: piš písmena dřív, než dorazí',url:''},
  {id:'a4',name:'Příklady z násobilky',desc:'Násobení a dělení, QR kód trestu',url:''},
  {id:'a5',name:'Připomínač se zvonkem',desc:'Připomínky s datem, časem a zvonkem',url:''},
  {id:'a6',name:'Kolik je dítěti let',desc:'Věk dítěte z data narození',url:''},
  {id:'a7',name:'Náhodná šipka',desc:'Losování šipky: ruleta, kolo štěstí',url:''}
];

(function(){
  var KEY='moje-aplikace:v2';
  var $=function(id){return document.getElementById(id)};
  var st={del:[],ren:{},extra:[]};
  var editing=null,pendingDel=null;

  try{
    var r=localStorage.getItem(KEY);
    if(r){var o=JSON.parse(r);
      if(o&&Array.isArray(o.del))st.del=o.del;
      if(o&&o.ren&&typeof o.ren==='object')st.ren=o.ren;
      if(o&&Array.isArray(o.extra))st.extra=o.extra;}
  }catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));return true}catch(e){return false}}
  function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
  function fixUrl(u){
    u=u.trim();
    if(!u)return '';
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u='https://'+u;
    return /^https?:\/\/[^\s]+\.[^\s]+/i.test(u)||/^https?:\/\/localhost/i.test(u)?u:null;
  }
  function msg(t,cls){var m=$('msg');m.textContent=t;m.className=cls||''}

  function all(){
    var out=[];
    APPS.forEach(function(a){
      if(st.del.indexOf(a.id)>=0)return;
      var o=st.ren[a.id]||{};
      out.push({id:a.id,name:o.name||a.name,desc:a.desc,url:o.url!==undefined?o.url:a.url});
    });
    st.extra.forEach(function(a){out.push(a)});
    return out;
  }

  function render(){
    var t=norm($('q').value.trim()),box=$('list'),n=0;
    box.textContent='';
    all().forEach(function(it){
      if(t&&norm(it.name).indexOf(t)<0)return;
      n++;
      var row=document.createElement('div');row.className='app';

      if(editing===it.id){
        var ed=document.createElement('div');ed.className='edit';
        var i1=document.createElement('input');i1.type='text';i1.value=it.name;i1.setAttribute('aria-label','Nový název');
        var i2=document.createElement('input');i2.type='text';i2.value=it.url||'';i2.placeholder='https://…';i2.setAttribute('aria-label','Odkaz');
        var bt=document.createElement('div');bt.className='btns';
        var ok=document.createElement('button');ok.type='button';ok.className='ok';ok.textContent='Uložit';
        var no=document.createElement('button');no.type='button';no.textContent='Zrušit';
        ok.onclick=function(){
          var nm=i1.value.trim(),u=fixUrl(i2.value);
          if(!nm){i1.focus();return}
          if(u===null){i2.focus();return}
          if(String(it.id).charAt(0)==='x'){
            st.extra.forEach(function(e){if(e.id===it.id){e.name=nm;e.url=u}});
          }else{st.ren[it.id]={name:nm,url:u}}
          editing=null;save();render();
        };
        no.onclick=function(){editing=null;render()};
        bt.appendChild(ok);bt.appendChild(no);
        ed.appendChild(i1);ed.appendChild(i2);ed.appendChild(bt);
        row.appendChild(ed);
        box.appendChild(row);
        return;
      }

      var body=document.createElement('div');body.className='main';
      if(it.url){
        var a=document.createElement('a');a.href=it.url;a.target='_blank';a.rel='noopener';a.textContent=it.name;
        body.appendChild(a);
      }else{
        var nl=document.createElement('div');nl.className='nolink';nl.textContent=it.name;
        body.appendChild(nl);
      }
      var s=document.createElement('span');
      s.textContent=it.url?(it.desc||it.url):((it.desc?it.desc+' · ':'')+'odkaz chybí, použij Přejmenovat a doplň ho');
      body.appendChild(s);
      row.appendChild(body);

      var tools=document.createElement('div');tools.className='tools';
      var re=document.createElement('button');re.type='button';re.textContent='Přejmenovat';
      re.setAttribute('aria-label','Přejmenovat '+it.name);
      re.onclick=function(){editing=it.id;pendingDel=null;render()};
      var x=document.createElement('button');x.type='button';x.className='del';
      x.textContent=(pendingDel===it.id)?'Opravdu smazat?':'Smazat';
      x.setAttribute('aria-label','Smazat '+it.name);
      x.onclick=function(){
        if(pendingDel!==it.id){
          pendingDel=it.id;render();
          setTimeout(function(){if(pendingDel===it.id){pendingDel=null;render()}},4000);
          return;
        }
        pendingDel=null;
        if(String(it.id).charAt(0)==='x'){
          st.extra=st.extra.filter(function(e){return e.id!==it.id});
        }else if(st.del.indexOf(it.id)<0){st.del.push(it.id)}
        save();render();
      };
      tools.appendChild(re);tools.appendChild(x);row.appendChild(tools);
      box.appendChild(row);
    });
    $('none').style.display=n?'none':'block';
  }

  function addLink(){
    var name=$('n').value.trim(),u=fixUrl($('u').value);
    if(!name){msg('Napiš název.','err');$('n').focus();return}
    if(!$('u').value.trim()||u===null){msg('Napiš platnou adresu, např. https://seznam.cz','err');$('u').focus();return}
    st.extra.push({id:'x'+Date.now()+Math.random().toString(36).slice(2,6),name:name,desc:$('d').value.trim(),url:u});
    var saved=save();
    $('n').value='';$('d').value='';$('u').value='';
    $('q').value='';
    render();
    msg(saved?'Odkaz přidán.':'Odkaz je přidaný, ale po zavření stránky se neuloží.',saved?'ok':'err');
  }

  $('addBtn').addEventListener('click',addLink);
  ['n','d','u'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addLink()}});
  });
  $('q').addEventListener('input',render);
  render();
})();
</script>
</body>
</html>
