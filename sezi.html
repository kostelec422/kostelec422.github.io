<head>

<style>

@media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f27;--text:#f1f2f5;--muted:#9ca3af;--line:#303541;--accent:#7b9cff;--accent-text:#0b1220;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#menu{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 14px}

.app{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px}
.app:hover{border-color:var(--accent)}

.app span{color:var(--muted);font-size:.9rem}

#viewer{display:none;flex-direction:column;height:100%;height:100dvh}

</head>

<script type="text/plain" id="src-zakaznici">
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zákazníci</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#dcdad2;--accent:#b45309;--accent-text:#fff;--ok:#15803d;--warn:#b91c1c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--text:#f1f0ea;--muted:#a3a29a;--line:#3a3a36;--accent:#f59e0b;--accent-text:#1a1200;--ok:#4ade80;--warn:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--text:#f1f0ea;--muted:#a3a29a;--line:#3a3a36;--accent:#f59e0b;--accent-text:#1a1200;--ok:#4ade80;--warn:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=tel]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.row{display:flex;gap:10px;margin-bottom:12px}
.row>div{flex:1}
.row>div.small{flex:0 0 110px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 14px;display:block;width:100%;text-align:center;margin:0}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;margin:0;font-size:inherit;color:inherit}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:flex;gap:6px}
.seg button{padding:10px 12px;width:auto}
.seg button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.status{font-size:.9rem;min-height:1.3em;margin-top:8px}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .info{flex:1;min-width:0}
li .name{word-break:break-word}
li .phone{font-size:.9rem;color:var(--muted)}
li .phone a{color:var(--accent)}
li .num{font-weight:700;font-size:1.2rem;min-width:2.5ch;text-align:right}
li .num small{font-weight:400;color:var(--muted);font-size:.8rem}
li button{padding:8px 10px;color:var(--warn);width:auto}
.empty{color:var(--muted);text-align:center;padding:16px 0}
.sum{color:var(--muted);font-size:.9rem;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Zákazníci</h1>

<div class="card">
  <div class="row">
    <div><label for="name">Jméno zákazníka</label><input type="text" id="name" autocomplete="off"></div>
    <div class="small"><label for="doors">Počet dveří</label><input type="number" id="doors" min="1" step="1" inputmode="numeric"></div>
  </div>
  <div style="margin-bottom:12px">
    <label for="phone">Telefon (nepovinné)</label>
    <input type="tel" id="phone" autocomplete="off" inputmode="tel">
  </div>
  <button class="primary" id="add">Přidat</button>
  <div class="status" id="msg"></div>
</div>

<div class="card">
  <label class="toggle" for="auto"><span>Ukládat automaticky</span><input type="checkbox" id="auto"></label>
  <button id="save" style="margin-top:6px">Uložit</button>
  <div class="status" id="saveStatus"></div>
  <button id="export" style="margin-top:10px">Stáhnout do souboru</button>
  <div class="status" id="fileMsg"></div>
</div>

<div class="card">
  <div class="bar">
    <strong>Seznam</strong>
    <div class="seg">
      <button id="desc">Nejvíc → nejméně</button>
      <button id="asc">Nejméně → nejvíc</button>
    </div>
  </div>
  <ul id="list"></ul>
  <div class="sum" id="sum"></div>
</div>
</main>

<script>
(function(){
  var KEY_DATA='dvere:data', KEY_SET='dvere:nastaveni';
  var items=[], sort='desc', auto=false, dirty=false, pendingDel=null, dbDoc=null, dl=null;
  var $=function(id){return document.getElementById(id)};

  function read(key){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
  function write(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); return true; }catch(e){ return false; } }

  function persist(){
    var okLocal=write(KEY_DATA,items);
    if(dbDoc){
      dbDoc.set({items:items}).then(function(){ dirty=false; renderStatus(); })
        .catch(function(){ if(okLocal) dirty=false; renderStatus('db'); });
    } else {
      if(okLocal) dirty=false;
      renderStatus(okLocal?null:'fail');
    }
  }
  function saveSettings(){ write(KEY_SET,{auto:auto,sort:sort}); }

  function renderStatus(err){
    var el=$('saveStatus');
    if(err==='db'){ el.textContent='Uloženo jen v tomto prohlížeči, na server se to nepovedlo.'; el.className='status warn'; return; }
    if(err){ el.textContent='Uložení se nepovedlo.'; el.className='status warn'; return; }
    if(dirty){ el.textContent='Neuložené změny – stiskni „Uložit“.'; el.className='status warn'; }
    else { el.textContent='Všechno je uložené.'; el.className='status ok'; }
  }

  function changed(){
    if(auto){ persist(); } else { dirty=true; renderStatus(); }
    render();
  }

  function render(){
    var sorted=items.slice().sort(function(a,b){
      return sort==='desc' ? b.doors-a.doors : a.doors-b.doors;
    });
    var ul=$('list'); ul.innerHTML='';
    if(!sorted.length){
      var e=document.createElement('div'); e.className='empty'; e.textContent='Zatím tu nic není.'; ul.appendChild(e);
    }
    sorted.forEach(function(it){
      var li=document.createElement('li');
      var info=document.createElement('div'); info.className='info';
      var n=document.createElement('div'); n.className='name'; n.textContent=it.name; info.appendChild(n);
      if(it.phone){
        var p=document.createElement('div'); p.className='phone';
        var digits=String(it.phone).replace(/[^0-9+]/g,'');
        if(digits){ var a=document.createElement('a'); a.href='tel:'+digits; a.textContent=it.phone; p.appendChild(a); }
        else { p.textContent=it.phone; }
        info.appendChild(p);
      }
      li.appendChild(info);
      var d=document.createElement('span'); d.className='num'; d.textContent=it.doors+' ';
      var s=document.createElement('small'); s.textContent='ks'; d.appendChild(s);
      li.appendChild(d);
      var x=document.createElement('button'); x.textContent=(pendingDel===it.id)?'Opravdu smazat?':'Smazat'; x.setAttribute('aria-label','Smazat '+it.name);
      x.onclick=function(){
        if(pendingDel!==it.id){
          pendingDel=it.id; render();
          setTimeout(function(){ if(pendingDel===it.id){ pendingDel=null; render(); } },4000);
          return;
        }
        pendingDel=null;
        items=items.filter(function(i){return i.id!==it.id});
        changed();
      };
      li.appendChild(x);
      ul.appendChild(li);
    });
    var total=items.reduce(function(a,i){return a+i.doors},0);
    $('sum').textContent=items.length?('Zákazníků: '+items.length+' · Dveří celkem: '+total):'';
    $('desc').className=sort==='desc'?'on':'';
    $('asc').className=sort==='asc'?'on':'';
  }

  function add(){
    var name=$('name').value.trim();
    var doors=parseInt($('doors').value,10);
    var phone=$('phone').value.trim();
    var m=$('msg');
    if(!name){ m.textContent='Napiš jméno zákazníka.'; m.className='status warn'; $('name').focus(); return; }
    if(!doors||doors<1){ m.textContent='Napiš počet dveří (aspoň 1).'; m.className='status warn'; $('doors').focus(); return; }
    var it={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),name:name,doors:doors};
    if(phone) it.phone=phone;
    items.push(it);
    $('name').value=''; $('doors').value=''; $('phone').value='';
    m.textContent=''; m.className='status';
    $('name').focus();
    changed();
  }

  function fileMsg(t,cls){ var el=$('fileMsg'); el.textContent=t; el.className='status '+(cls||''); }

  function exportFile(){
    var q=function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; };
    var rows=items.slice().sort(function(a,b){ return sort==='desc'?b.doors-a.doors:a.doors-b.doors; });
    var csv='\ufeff'+'Zákazník;Telefon;Počet dveří\n'+rows.map(function(i){return q(i.name)+';'+q(i.phone)+';'+i.doors}).join('\n');
    var fname='zakaznici.csv';
    if(dl){
      dl.save({filename:fname,data:csv})
        .then(function(){ fileMsg('Soubor je stažený.','ok'); })
        .catch(function(){ fileMsg('Stažení se nepovedlo nebo bylo zrušené.','warn'); });
      return;
    }
    try{
      var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a'); a.href=url; a.download=fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },2000);
      fileMsg('Soubor je stažený.','ok');
    }catch(e){ fileMsg('Stažení se nepovedlo.','warn'); }
  }

  $('add').onclick=add;
  ['name','doors','phone'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); add(); } });
  });
  $('save').onclick=persist;
  $('auto').onchange=function(){
    auto=this.checked; saveSettings();
    if(auto && dirty) persist(); else renderStatus();
  };
  $('desc').onclick=function(){ sort='desc'; saveSettings(); render(); };
  $('asc').onclick=function(){ sort='asc'; saveSettings(); render(); };
  $('export').onclick=exportFile;

  var st=read(KEY_SET); if(st){ auto=!!st.auto; if(st.sort==='asc'||st.sort==='desc') sort=st.sort; }
  var data=read(KEY_DATA); if(Array.isArray(data)) items=data;
  $('auto').checked=auto;
  render(); renderStatus();

  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(d){ if(d) dl=d; }).catch(function(){});
    window.claude.use('db').then(function(db){
      if(!db) return;
      var ref=db.doc('data/seznam');
      ref.get().then(function(snap){
        if(snap.exists && snap.data() && Array.isArray(snap.data().items)){
          items=snap.data().items; write(KEY_DATA,items); dirty=false;
        } else if(items.length){
          ref.set({items:items}).catch(function(){});
        }
        dbDoc=ref; render(); renderStatus();
      }).catch(function(){});
    }).catch(function(){});
  }
})();
</scr__ipt>
</body>
</html>
</script>

<script type="text/plain" id="src-nahled">
<title>HTML náhled</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: nástroj na dva sloupce (editor | výsledek), pod nimi rozbor kódu prvek po prvku. */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --fg: #1b2230;
    --muted: #5b6577;
    --line: #d9dde5;
    --accent: #2457d6;
    --accent-fg: #ffffff;
    --code-bg: #0f1623;
    --code-fg: #e4e9f4;
    --tag-bg: #e6ecfb;
    --tag-fg: #1d46b0;
    --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
    --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d121b; --surface: #151c29; --fg: #e6eaf2; --muted: #9aa5ba; --line: #283245;
      --accent: #6b95ff; --accent-fg: #0b1220; --code-bg: #0a0f19; --code-fg: #e4e9f4;
      --tag-bg: #1e2a47; --tag-fg: #9db8ff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d121b; --surface: #151c29; --fg: #e6eaf2; --muted: #9aa5ba; --line: #283245;
    --accent: #6b95ff; --accent-fg: #0b1220; --code-bg: #0a0f19; --code-fg: #e4e9f4;
    --tag-bg: #1e2a47; --tag-fg: #9db8ff; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-head); font-size: 1.75rem; line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .sub { color: var(--muted); margin: 4px 0 0; max-width: 60ch; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer;
    padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 800px) { .panes { grid-template-columns: minmax(0, 1fr); } }
  .pane { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .pane-title {
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 8px;
  }
  textarea#kod {
    width: 100%; height: 420px; resize: vertical; border: 0; padding: 14px;
    background: var(--code-bg); color: var(--code-fg);
    font-family: var(--font-code); font-size: 0.8125rem; line-height: 1.6; tab-size: 2; white-space: pre; overflow: auto;
  }
  iframe#vysledek { width: 100%; height: 420px; border: 0; background: #ffffff; display: block; }

  section.rozbor { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  section.rozbor h2 { font-family: var(--font-head); font-size: 1.125rem; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .souhrn { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .chip { font-family: var(--font-code); font-size: 0.8125rem; background: var(--tag-bg); color: var(--tag-fg); padding: 3px 9px; border-radius: 4px; }
  .chip b { font-weight: 700; }
  .strom { list-style: none; margin: 0; padding: 8px 16px 16px; display: flex; flex-direction: column; }
  .uzel { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 4px 14px; padding: 7px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
  .uzel:last-child { border-bottom: 0; }
  .znacka { font-family: var(--font-code); font-size: 0.8125rem; color: var(--tag-fg); background: var(--tag-bg); padding: 2px 8px; border-radius: 4px; white-space: nowrap; justify-self: start; }
  .popis { min-width: 0; overflow-wrap: anywhere; }
  .popis .atr { display: block; color: var(--muted); font-size: 0.8125rem; font-family: var(--font-code); }
  .popis .txt { color: var(--muted); font-size: 0.8125rem; }
  .prazdno { padding: 20px 16px; color: var(--muted); }
  .chyba { padding: 14px 16px; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>HTML náhled</h1>
      <p class="sub">Vlož HTML kód vlevo. Vpravo se hned ukáže výsledek a dole je vysvětlení, co jednotlivé značky dělají.</p>
    </div>
    <div class="actions">
      <button id="vycistit" type="button">Smazat kód</button>
    </div>
  </header>

  <div class="panes">
    <div class="pane">
      <div class="pane-title"><span>HTML kód</span><span id="pocet">0 znaků</span></div>
      <textarea id="kod" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="HTML kód"></textarea>
    </div>
    <div class="pane">
      <div class="pane-title"><span>Výsledek</span><span>jak to uvidí návštěvník</span></div>
      <iframe id="vysledek" title="Výsledek HTML kódu" sandbox="allow-scripts"></iframe>
    </div>
  </div>

  <section class="rozbor" aria-live="polite">
    <h2>Co kód dělá</h2>
    <div class="souhrn" id="souhrn"></div>
    <ul class="strom" id="strom"></ul>
  </section>
</div>

<script>
(function () {
  var kod = document.getElementById('kod');
  var okno = document.getElementById('vysledek');
  var pocet = document.getElementById('pocet');
  var souhrn = document.getElementById('souhrn');
  var strom = document.getElementById('strom');

  var POPISY = {
    html: 'Kořen celé stránky, obsahuje všechno ostatní.',
    head: 'Hlavička: údaje o stránce, které se nezobrazují přímo (titulek, styly, kódování).',
    body: 'Tělo stránky: všechno, co návštěvník vidí.',
    title: 'Titulek stránky, ukazuje se v záložce prohlížeče.',
    meta: 'Doplňující informace o stránce (například kódování znaků).',
    link: 'Propojení s externím souborem, nejčastěji se styly.',

    nav: 'Navigace, tedy skupina hlavních odkazů.',
    main: 'Hlavní obsah stránky.',
    article: 'Samostatný článek nebo příspěvek.',
    aside: 'Vedlejší obsah, například postranní panel.',
    video: 'Přehrávač videa.',
    audio: 'Přehrávač zvuku.',
    canvas: 'Plocha pro kreslení pomocí JavaScriptu.',
    svg: 'Vektorová grafika.',
    iframe: 'Vložená jiná stránka v rámečku.'
  };

  var ATRIBUTY = {
    href: 'cíl odkazu', src: 'zdroj souboru', alt: 'náhradní text', class: 'třída pro styly',
    id: 'jedinečné jméno', style: 'styl přímo na prvku', type: 'druh pole', onclick: 'kód po kliknutí'
  };

  function popisZnacky(tag) {
    return POPISY[tag] || 'Značka <' + tag + '>. Pro ni zatím nemám vlastní vysvětlení.';
  }

  function textPrvku(el) {
    var t = '';
    for (var i = 0; i < el.childNodes.length; i++) {
      if (el.childNodes[i].nodeType === 3) t += el.childNodes[i].nodeValue;
    }
    t = t.replace(/\s+/g, ' ').trim();
    if (t.length > 70) t = t.slice(0, 70) + '…';
    return t;
  }

  function atributy(el) {
    var out = [];
    for (var i = 0; i < el.attributes.length; i++) {
      var a = el.attributes[i];
      var v = a.value.length > 60 ? a.value.slice(0, 60) + '…' : a.value;
      var vys = ATRIBUTY[a.name] ? ' (' + ATRIBUTY[a.name] + ')' : '';
      out.push(a.name + '="' + v + '"' + vys);
    }
    return out;
  }

  function chip(html) {
    var s = document.createElement('span');
    s.className = 'chip';
    s.innerHTML = html;
    return s;
  }

  function rozbor(code) {
    souhrn.textContent = '';
    strom.textContent = '';
    if (!code.trim()) {
      var li0 = document.createElement('li');
      li0.className = 'prazdno';
      li0.textContent = 'Zatím tu není žádný kód. Vlož ho do pole vlevo a tady se objeví vysvětlení.';
      strom.appendChild(li0);
      return;
    }
    var doc = new DOMParser().parseFromString(code, 'text/html');
    var pocty = {};
    var radky = [];
    var hlavni = /<html[\s>]/i.test(code);
    var maHead = /<head[\s>]/i.test(code);
    var maBody = /<body[\s>]/i.test(code);

    function projdi(el, hloubka) {
      var tag = el.tagName.toLowerCase();
      var vlastni = true;
      if (tag === 'html' && !hlavni) vlastni = false;
      if (tag === 'head' && !maHead && !el.children.length) vlastni = false;
      if (tag === 'head' && !maHead) vlastni = false;
      if (tag === 'body' && !maBody) vlastni = false;
      var d = hloubka;
      if (vlastni) {
        pocty[tag] = (pocty[tag] || 0) + 1;
        radky.push({ tag: tag, hloubka: hloubka, el: el });
        d = hloubka + 1;
      }
      for (var i = 0; i < el.children.length; i++) projdi(el.children[i], d);
    }
    projdi(doc.documentElement, 0);

    var celkem = radky.length;
    souhrn.appendChild(chip('prvků celkem: <b>' + celkem + '</b>'));
    Object.keys(pocty).sort().forEach(function (t) {
      souhrn.appendChild(chip('&lt;' + t + '&gt; <b>×' + pocty[t] + '</b>'));
    });

    radky.slice(0, 300).forEach(function (r) {
      var li = document.createElement('li');
      li.className = 'uzel';
      li.style.paddingLeft = Math.min(r.hloubka, 8) * 18 + 'px';
      var z = document.createElement('span');
      z.className = 'znacka';
      z.textContent = '<' + r.tag + '>';
      var p = document.createElement('div');
      p.className = 'popis';
      var hlavniText = document.createElement('div');
      hlavniText.textContent = popisZnacky(r.tag);
      p.appendChild(hlavniText);
      var at = atributy(r.el);
      if (at.length) {
        var sa = document.createElement('span');
        sa.className = 'atr';
        sa.textContent = at.join('  ');
        p.appendChild(sa);
      }
      if (r.tag !== 'script' && r.tag !== 'style') {
        var tx = textPrvku(r.el);
        if (tx) {
          var st = document.createElement('span');
          st.className = 'txt';
          st.textContent = 'Text: „' + tx + '“';
          p.appendChild(st);
        }
      }
      li.appendChild(z);
      li.appendChild(p);
      strom.appendChild(li);
    });
    if (radky.length > 300) {
      var more = document.createElement('li');
      more.className = 'prazdno';
      more.textContent = 'Zobrazuji prvních 300 prvků z ' + radky.length + '.';
      strom.appendChild(more);
    }
  }

  var casovac = null;
  function obnov() {
    var code = kod.value;
    pocet.textContent = code.length.toLocaleString('cs-CZ') + ' znaků';
    okno.srcdoc = code;
    try { rozbor(code); } catch (e) {
      strom.textContent = '';
      var li = document.createElement('li');
      li.className = 'chyba';
      li.textContent = 'Kód se nepodařilo rozebrat.';
      strom.appendChild(li);
    }
  }
  function odlozene() { clearTimeout(casovac); casovac = setTimeout(obnov, 250); }

  kod.addEventListener('input', odlozene);
  kod.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = kod.selectionStart, k = kod.selectionEnd;
      kod.value = kod.value.slice(0, s) + '  ' + kod.value.slice(k);
      kod.selectionStart = kod.selectionEnd = s + 2;
      odlozene();
    }
  });
  document.getElementById('vycistit').addEventListener('click', function () { kod.value = ''; obnov(); kod.focus(); });

  obnov();
})();
