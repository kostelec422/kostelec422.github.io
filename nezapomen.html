<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Připomínač se zvonkem</title>
<style>
:root{
  --bg:#eef1ec; --surface:#fbfcfa; --ink:#1d2a24; --muted:#5d6b64; --line:#cfd8d1;
  --accent:#1f6b52; --accent-ink:#ffffff; --alert:#b3401f; --alert-ink:#ffffff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a16; --surface:#1b2520; --ink:#e6eee9; --muted:#9baba3; --line:#2f3d36;
    --accent:#5fc19c; --accent-ink:#0c1a14; --alert:#ee8a63; --alert-ink:#1a0c06;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a16; --surface:#1b2520; --ink:#e6eee9; --muted:#9baba3; --line:#2f3d36;
  --accent:#5fc19c; --accent-ink:#0c1a14; --alert:#ee8a63; --alert-ink:#1a0c06; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:2rem;line-height:1.15;margin:0 0 4px}
.clock{font-family:Georgia,"Times New Roman",serif;font-size:3.2rem;letter-spacing:.02em;margin:0;font-variant-numeric:tabular-nums}
.date{color:var(--muted);margin:0 0 24px}
form,.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;margin:0 0 6px}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.field{margin-top:14px}
.row .field{margin-top:0}
.tone{display:flex;gap:8px}
.tone select{flex:1}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;width:100%;margin-top:18px;padding:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{margin-top:22px}
.list h2{margin:0 0 10px;font-size:1.1rem}
.empty{color:var(--muted);margin:0}
.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item p{margin:0}
.when{font-weight:600;font-variant-numeric:tabular-nums}
.meta{color:var(--muted);font-size:.9rem}
.item.done .when,.item.done .txt{text-decoration:line-through;color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem;margin:14px 0 0}
.ring{position:fixed;inset:0;background:var(--alert);color:var(--alert-ink);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;gap:18px}
.ring.on{display:flex}
.ring h2{font-family:Georgia,serif;font-size:2.4rem;margin:0}
.ring p{font-size:1.4rem;margin:0;max-width:28ch;overflow-wrap:anywhere}
.ring button{background:var(--alert-ink);color:var(--alert);border:0;font-weight:700;font-size:1.1rem;padding:16px 28px;max-width:100%}
.ring #done{background:transparent;color:var(--alert-ink);border:2px solid var(--alert-ink)}
@media (max-width:420px){.row{grid-template-columns:1fr}.clock{font-size:2.6rem}}
</style>
</head>
<body>
<main>
  <h1>Připomínač</h1>
  <p class="clock" id="clock">--:--:--</p>
  <p class="date" id="today"></p>

  <form id="f">
    <label for="txt">Co si chceš připomenout?</label>
    <textarea id="txt" placeholder="Např. Zavolat doktorovi" required></textarea>
    <div class="row">
      <div class="field"><label for="d">Datum</label><input type="date" id="d" required></div>
      <div class="field"><label for="t">Čas</label><input type="time" id="t" required></div>
    </div>
    <div class="field">
      <label for="tone">Znělka</label>
      <div class="tone">
        <select id="tone"></select>
        <button type="button" id="prev">Přehrát</button>
      </div>
    </div>
    <div class="field" id="fileWrap" hidden>
      <label for="file">Vlastní zvukový soubor</label>
      <input type="file" id="file" accept="audio/*">
    </div>
    <button class="primary" type="submit">Přidat připomínku</button>
    <p class="hint">Nech stránku otevřenou v prohlížeči a neukončuj ji. Stránka běží na pozadí, i když je displej zhasnutý. Na jistotu můžeš použít „Do kalendáře“. Vlastní soubor platí jen do zavření stránky.</p>
  </form>

  <section class="list" aria-live="polite">
    <h2>Naplánováno</h2>
    <div id="items"></div>
  </section>
</main>

<div class="ring" id="ring" role="alertdialog" aria-live="assertive">
  <h2>Je čas!</h2>
  <p id="ringTxt"></p>
  <button id="stop">Vypnout (zazvoní znovu za 1 minutu)</button>
  <button id="done">Úplně vypnout</button>
</div>

<script>
(function(){
  var KEY = "pripominac:v1";
  var $ = function(id){ return document.getElementById(id); };
  var items = [];
  var customUrl = null, customName = "";
  var customById = {};
  var ctx = null, stopFn = null, queue = [], current = null;

  var TONES = {
    zvonek:  {n:"Zvonek",  type:"sine",     seq:[[880,.14],[0,.06],[880,.14],[0,.06],[880,.14],[0,.7]]},
    alarm:   {n:"Alarm",   type:"square",   seq:[[1000,.2],[700,.2],[1000,.2],[700,.2],[0,.5]]},
    melodie: {n:"Melodie", type:"triangle", seq:[[523,.2],[659,.2],[784,.2],[1047,.45],[0,.7]]},
    digital: {n:"Digitální pípání", type:"square", seq:[[1500,.07],[0,.07],[1500,.07],[0,.07],[1500,.07],[0,.6]]},
    gong:    {n:"Gong",    type:"sine",     seq:[[196,1.6],[0,.8]]}
  };

  var sel = $("tone");
  Object.keys(TONES).forEach(function(k){
    var o = document.createElement("option"); o.value = k; o.textContent = TONES[k].n; sel.appendChild(o);
  });
  var oc = document.createElement("option"); oc.value = "custom"; oc.textContent = "Vlastní soubor…"; sel.appendChild(oc);

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function fmt(ms){
    var x = new Date(ms);
    return x.getDate() + ". " + (x.getMonth()+1) + ". " + x.getFullYear() + " v " + pad(x.getHours()) + ":" + pad(x.getMinutes());
  }
  function load(){
    try { var r = localStorage.getItem(KEY); items = r ? JSON.parse(r) : []; } catch(e){ items = []; }
    if (!Array.isArray(items)) items = [];
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){} }

  function audio(){
    if (!ctx) { var C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function playTone(key){
    var a = audio(); if (!a) return function(){};
    var t = TONES[key] || TONES.zvonek;
    var total = t.seq.reduce(function(s,x){ return s + x[1]; }, 0);
    var alive = true, timer;
    function once(){
      var at = a.currentTime + .02;
      t.seq.forEach(function(x){
        if (x[0] > 0) {
          var o = a.createOscillator(), g = a.createGain();
          o.type = t.type; o.frequency.value = x[0];
          g.gain.setValueAtTime(0, at);
          g.gain.linearRampToValueAtTime(.25, at + .01);
          g.gain.exponentialRampToValueAtTime(.001, at + x[1]);
          o.connect(g); g.connect(a.destination);
          o.start(at); o.stop(at + x[1] + .02);
        }
        at += x[1];
      });
    }
    once();
    timer = setInterval(function(){ if (alive) once(); }, total * 1000);
    return function(){ alive = false; clearInterval(timer); };
  }

  function playFile(url){
    var el = new Audio(url); el.loop = true;
    el.play().catch(function(){});
    return function(){ el.pause(); el.currentTime = 0; };
  }

  function startRing(it){
    if (stopFn) { queue.push(it); return; }
    current = it;
    $("ringTxt").textContent = it.text;
    $("ring").classList.add("on");
    var url = customById[it.id];
    stopFn = (it.tone === "custom" && url) ? playFile(url) : playTone(it.tone === "custom" ? "zvonek" : it.tone);
    if (window.Notification && Notification.permission === "granted") {
      try { new Notification("Je čas!", {body: it.text}); } catch(e){}
    }
  }
  function closeRing(snooze){
    if (stopFn) stopFn();
    stopFn = null;
    $("ring").classList.remove("on");
    if (current) {
      if (snooze) { current.at = Date.now() + 60000; current.done = false; }
      save(); render();
    }
    current = null;
    var next = queue.shift();
    if (next) startRing(next);
  }
  $("stop").addEventListener("click", function(){ closeRing(true); });
  $("done").addEventListener("click", function(){ closeRing(false); });

  function tick(){
    var now = new Date();
    $("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    $("today").textContent = now.toLocaleDateString("cs-CZ", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    var changed = false;
    items.forEach(function(it){
      if (!it.done && it.at <= now.getTime()) { it.done = true; changed = true; startRing(it); }
    });
    if (changed) { save(); render(); }
    syncKeep();
  }

  function render(){
    var box = $("items"); box.textContent = "";
    if (!items.length) {
      var p = document.createElement("p"); p.className = "empty";
      p.textContent = "Zatím nic. Napiš poznámku, nastav datum a čas a přidej ji.";
      box.appendChild(p); return;
    }
    items.slice().sort(function(a,b){ return a.at - b.at; }).forEach(function(it){
      var d = document.createElement("div"); d.className = "item" + (it.done ? " done" : "");
      var l = document.createElement("div");
      var w = document.createElement("p"); w.className = "when"; w.textContent = fmt(it.at);
      var x = document.createElement("p"); x.className = "txt"; x.textContent = it.text;
      var m = document.createElement("p"); m.className = "meta";
      m.textContent = "Znělka: " + (it.tone === "custom" ? "vlastní soubor" : TONES[it.tone].n) + (it.done ? " · odezněla" : "");
      l.appendChild(w); l.appendChild(x); l.appendChild(m);
      var b = document.createElement("button"); b.type = "button"; b.textContent = "Smazat";
      b.addEventListener("click", function(){
        items = items.filter(function(z){ return z.id !== it.id; });
        delete customById[it.id]; save(); render();
      });
      var c = document.createElement("button"); c.type = "button"; c.textContent = "Do kalendáře";
      c.addEventListener("click", function(){ window.__exportIcs(it); });
      var bw = document.createElement("div"); bw.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end";
      bw.appendChild(c); bw.appendChild(b);
      d.appendChild(l); d.appendChild(bw); box.appendChild(d);
    });
  }

  sel.addEventListener("change", function(){ $("fileWrap").hidden = sel.value !== "custom"; });
  $("file").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    if (customUrl) URL.revokeObjectURL(customUrl);
    customUrl = URL.createObjectURL(f); customName = f.name;
  });

  var prevStop = null;
  $("prev").addEventListener("click", function(){
    if (prevStop) { prevStop(); prevStop = null; $("prev").textContent = "Přehrát"; return; }
    prevStop = (sel.value === "custom") ? (customUrl ? playFile(customUrl) : null) : playTone(sel.value);
    if (prevStop) {
      $("prev").textContent = "Zastavit";
      var s = prevStop;
      setTimeout(function(){ if (prevStop === s) { s(); prevStop = null; $("prev").textContent = "Přehrát"; } }, 6000);
    }
  });

  $("f").addEventListener("submit", function(e){
    e.preventDefault();
    audio();
    var at = new Date($("d").value + "T" + $("t").value).getTime();
    if (isNaN(at)) return;
    if (sel.value === "custom" && !customUrl) { alert("Vyber zvukový soubor, nebo jinou znělku."); return; }
    var id = String(Date.now()) + Math.random().toString(36).slice(2, 6);
    items.push({id: id, text: $("txt").value.trim(), at: at, tone: sel.value, done: false});
    if (sel.value === "custom") customById[id] = customUrl;
    if (window.Notification && Notification.permission === "default") { try { Notification.requestPermission(); } catch(e2){} }
    save(); render(); syncKeep();
    $("txt").value = "";
  });

  var n = new Date(Date.now() + 60000);
  $("d").value = n.getFullYear() + "-" + pad(n.getMonth()+1) + "-" + pad(n.getDate());
  $("t").value = pad(n.getHours()) + ":" + pad(n.getMinutes());

  var ka = null;
  function silentWav(){
    var sr = 8000, n = sr, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    function w(o, str){ for (var i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); }
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, n * 2, true);
    for (var i = 0; i < n; i++) v.setInt16(44 + i * 2, i % 2 ? 1 : -1, true);
    return URL.createObjectURL(new Blob([buf], {type: "audio/wav"}));
  }
  function syncKeep(){
    var pend = !!stopFn || items.some(function(i){ return !i.done; });
    if (pend && !ka) {
      ka = new Audio(silentWav()); ka.loop = true;
      ka.play().catch(function(){ ka = null; });
      try {
        if (navigator.mediaSession) navigator.mediaSession.metadata = new MediaMetadata({title: "Připomínač běží", artist: "Čeká na zadaný čas"});
      } catch(e){}
    } else if (!pend && ka) { ka.pause(); ka = null; }
  }
  document.addEventListener("click", syncKeep);
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") tick(); });

  function icsDate(ms){
    var x = new Date(ms);
    return x.getFullYear() + pad(x.getMonth()+1) + pad(x.getDate()) + "T" + pad(x.getHours()) + pad(x.getMinutes()) + "00";
  }
  function exportIcs(it){
    var txt = it.text.replace(/[\\;,]/g, " ").replace(/\r?\n/g, " ");
    var lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Pripominac//CS","BEGIN:VEVENT",
      "UID:" + it.id + "@pripominac","DTSTAMP:" + icsDate(Date.now()),
      "DTSTART:" + icsDate(it.at),"DTEND:" + icsDate(it.at + 300000),
      "SUMMARY:" + txt,"BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY","DESCRIPTION:" + txt,"END:VALARM","END:VEVENT","END:VCALENDAR"];
    var blob = new Blob([lines.join("\r\n")], {type:"text/calendar"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "pripominka.ics";
    document.body.appendChild(a); a.click(); a.remove();
  }
  window.__exportIcs = exportIcs;

  load(); render(); tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
