<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herní & Vývojářský Herní Rozcestník</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --badge-bg: #0369a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            max-width: 600px;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .section-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .card-icon {
            font-size: 2rem;
            background: rgba(56, 189, 248, 0.1);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .badge {
            align-self: flex-start;
            background-color: var(--badge-bg);
            color: #e0f2fe;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Styl pro budoucí uzamčené/připravované kachle */
        .card.disabled {
            opacity: 0.5;
            pointer-events: none;
            border-style: dashed;
        }

        footer {
            margin-top: auto;
            color: var(--text-muted);
            font-size: 0.9rem;
            text-align: center;
            padding-top: 2rem;
        }

        /* Úpravy pro mobilní zařízení */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            body {
                padding: 1.5rem 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Vývojářské Studio Ondra kleště</h1>
    </header>

    <main class="container">
        
        <h2 class="section-title">Dostupné hry & projekty</h2>
        
        <div class="grid">
            <!-- AKTIVNÍ PROJEKT -->
            <a href="hra2.html" class="card">
                <div class="card-header">
                    <div class="card-icon">🚀</div>
                    <div class="card-title">Bojovníci světa</div>
                </div>
                <p class="card-desc">Spusť nejnovější hru plnou dobrodružství, logických úkolů a zábavy.</p>
                <span class="badge">Spustit hru ➔</span>
            </a>

            <!-- BUDOUCÍ PROJEKT 1 (Připravujeme) -->
             <a href="http://ondrakleste.borec.cz" class="card">
                <div class="card-header">
                    <div class="card-icon">🧪</div>
                    <div class="card-title">Ondra kleště</div>
                </div>
                <p class="card-desc">Moje stránka</p>
                <span class="badge" style="background-color: #475569;">zde</span>
            </div>
        </div>

    </main>

    <footer>
        <p></p>
    </footer>

</body>
</html>
