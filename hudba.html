<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Písnička</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1d1b26;--mut:#6b6880;--ac:#6c4cf1;--bd:#ddd8ee}
@media (prefers-color-scheme:dark){:root{--bg:#14121c;--card:#1e1b2b;--tx:#efedf7;--mut:#a19db8;--ac:#8f78ff;--bd:#352f4d}}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea{-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px}
.w{max-width:620px;margin:0 auto}
h1{font-size:1.5rem;margin:8px 0 16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
small{color:var(--mut);font-weight:400}
textarea{width:100%;min-height:90px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;margin:0 8px 0 0}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:disabled{opacity:.4}
#info{color:var(--mut);margin:0 0 6px}
#bar{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin-bottom:10px}
#bar div{height:100%;width:0;background:var(--ac)}
#ly div{padding:6px 8px;border-radius:6px;color:var(--mut);transition:.2s}
#ly div.on{background:var(--ac);color:#fff}
.h{display:none}
</style>
</head>
<body>
<div class="w">
<h1>🎵 Písnička</h1>

<div class="c">
<label for="t">O čem bude písnička?</label>
<textarea id="t" placeholder="Např.: smutná písnička o rozchodu, divoká párty, na uspání…"></textarea>
</div>

<div class="c">
<label for="l">Text písničky <small>(nepovinné – bude se zpívat hlasem)</small></label>
<textarea id="l" placeholder="Sem napiš text, který se zazpívá. Když je krátký, bude se opakovat, aby písnička trvala aspoň minutu."></textarea>
</div>

<button id="go">▶ Zahrát písničku</button>
<button id="st" class="s" disabled>■ Zastavit</button>

<div id="res" class="c h" style="margin-top:14px">
<p id="info"></p>
<div id="bar"><div id="bp"></div></div>
<div id="ly"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MIN_MS=60000;
const INTRO_MS=3500;
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());

let ctx=null,master=null,timer=null,prog=null,keep=null,running=false,voice=null,songId=0,t0=0;
const hasSpeech='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;

function pickVoice(){
  if(!hasSpeech)return;
  const v=speechSynthesis.getVoices();
  voice=v.find(x=>/^cs/i.test(x.lang))||null;
}
if(hasSpeech){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

/* ---------- automatické vyhodnocení ---------- */
const KEYS={
  sleep:['uspá','uspan','spát','spani','spinká','dobrou noc','ukolébav','hajej','sladce spi','sny','sen','měsíc','hvězd','noc'],
  sad:['smut','pláč','plač','bol','sám','osam','zlomen','ztrat','stesk','rozchod','slz','mrzí','umř','smrt','lítost','chybí','chyb','konec','sbohem','deštiv','déšť'],
  wild:['divok','rychl','part','rock','šíl','energ','tanč','ohn','křik','bouř','pecka','metal','punk','řev','jedem','hoří','zábav','mejdan','pařba'],
  happy:['vesel','radost','šťast','sluní','léto','smích','směj','láska','lásk','miluj','úsměv','krás','sláv','hurá','jupí']
};
function analyze(text,lyrics){
  const all=text+' '+lyrics,x=all.toLowerCase();
  const sc={};
  for(const k in KEYS)sc[k]=KEYS[k].filter(w=>x.includes(w)).length;
  const excl=(x.match(/!/g)||[]).length;
  const caps=(all.match(/\b[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]{3,}\b/g)||[]).length;
  sc.wild+=Math.floor(excl/2)+caps;
  let best='calm',max=0;
  for(const k in sc){if(sc[k]>max){max=sc[k];best=k}}
  const M={
    sad:  {name:'smutná',    tempo:66, minor:true, pad:'triangle',lp:900, drums:false,mel:'sine',    rate:.7, lo:.5,hi:1.1,wild:false},
    wild: {name:'divoká',    tempo:148,minor:true, pad:'sawtooth',lp:1800,drums:true, mel:'square',  rate:1.25,lo:.8,hi:1.8,wild:true},
    sleep:{name:'ukolébavka',tempo:52, minor:false,pad:'sine',    lp:700, drums:false,mel:'sine',    rate:.55,lo:.6,hi:1.3,wild:false},
    happy:{name:'veselá',    tempo:112,minor:false,pad:'triangle',lp:2000,drums:true, mel:'triangle',rate:1,  lo:.8,hi:1.7,wild:false},
    calm: {name:'klidná',    tempo:90, minor:false,pad:'triangle',lp:1500,drums:true, mel:'triangle',rate:.85,lo:.7,hi:1.5,wild:false}
  }[best];
  const m={...M};
  const lines=lyrics.split(/\n+/).filter(s=>s.trim());
  if(lines.length){
    const avg=lines.reduce((a,l)=>a+l.trim().split(/\s+/).length,0)/lines.length;
    m.tempo+=Math.round((6-avg)*3);
  }
  m.tempo+=Math.min(excl,5)*3;
  m.tempo=Math.max(48,Math.min(165,m.tempo));
  m.rate=Math.max(.5,Math.min(1.5,m.rate*(m.tempo/M.tempo)));
  return m;
}

/* ---------- hudba (podkres) ---------- */
function startMusic(M,hasLyrics){
  const AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC();
  if(ctx.state==='suspended')ctx.resume();
  master=ctx.createGain();master.gain.value=hasLyrics?.2:.38;master.connect(ctx.destination);
  const beat=60/M.tempo;
  const root=50+Math.floor(Math.random()*10);
  const scale=M.minor?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];
  const pr=M.minor?[0,8,3,10]:[0,7,9,5];
  const third=M.minor?3:4;
  let nextT=ctx.currentTime+.1,beatN=0,idx=3;

  const nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;

  function tone(f,t,d,type,g,lp){
    const o=ctx.createOscillator(),e=ctx.createGain();
    o.type=type;o.frequency.value=f;
    let n=o;
    if(lp){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}
    n.connect(e);e.connect(master);
    e.gain.setValueAtTime(0,t);
    e.gain.linearRampToValueAtTime(g,t+.03);
    e.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t);o.stop(t+d+.05);
  }
  function noise(t,d,g,hp){
    const n=ctx.createBufferSource();n.buffer=nb;
    const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
    const e=ctx.createGain();
    n.connect(f);f.connect(e);e.connect(master);
    e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(.001,t+d);
    n.start(t);n.stop(t+d+.05);
  }
  function kick(t,g){
    const o=ctx.createOscillator(),e=ctx.createGain();
    o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
    o.connect(e);e.connect(master);
    e.gain.setValueAtTime(g,t);e.gain.exponentialRampToValueAtTime(.001,t+.25);
    o.start(t);o.stop(t+.3);
  }
  function playBeat(n,t){
    const bar=Math.floor(n/4),k=n%4;
    const cr=root+pr[bar%4];
    if(k===0){
      [0,third,7].forEach(iv=>tone(mtof(cr+iv),t,4*beat,M.pad,.08,M.lp));
      tone(mtof(cr-12),t,M.drums?beat*.9:4*beat*.95,'sine',.22);
    }else if(M.wild){
      tone(mtof(cr-12),t,beat*.9,'sine',.18);
    }
    if(M.drums){
      if(M.wild||k%2===0)kick(t,.5);
      if(k%2===1)noise(t,.14,.28,1500);
      if(M.wild){noise(t,.04,.1,7000);noise(t+beat/2,.04,.1,7000)}
    }
    if(hasLyrics&&!M.wild&&Math.random()<.5)return; // pod zpěvem méně not
    const step=M.wild?.5:1;
    for(let p=0;p<1;p+=step){
      if(Math.random()<(M.wild?.1:.3))continue;
      idx+=Math.floor(Math.random()*5)-2;
      idx=Math.max(0,Math.min(13,idx));
      const m=root+12+scale[idx%7]+12*Math.floor(idx/7);
      tone(mtof(m),t+p*beat,beat*(M.wild?.45:1.6),M.mel,M.name==='ukolébavka'?.1:.14,3200);
    }
  }
  timer=setInterval(()=>{
    if(!ctx)return;
    while(nextT<ctx.currentTime+.3){playBeat(beatN,nextT);nextT+=beat;beatN++}
  },40);
}

/* ---------- konec s doznětím ---------- */
function finish(id){
  if(!running||id!==songId)return;
  try{
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value,ctx.currentTime);
    master.gain.linearRampToValueAtTime(0,ctx.currentTime+3);
  }catch(e){}
  setTimeout(()=>{if(running&&id===songId)stop()},3100);
}

/* ---------- ZPĚV: každé slovo zazpívá hlas na výšku melodie ---------- */
function makeMelody(lines,M){
  // pro každý řádek pevná melodie (opakování zní stejně)
  const steps=7;
  let cur=3;
  return lines.map(line=>{
    const words=line.split(/\s+/).filter(Boolean);
    return words.map((w,i)=>{
      const last=i===words.length-1;
      if(last){cur=Math.max(0,Math.min(steps,cur-2+Math.floor(Math.random()*2)));}
      else{cur+=Math.floor(Math.random()*5)-2;cur=Math.max(0,Math.min(steps,cur));}
      return {w,deg:cur,last};
    });
  });
}

function sing(M,lines,id){
  const ly=$('ly');
  const n=lines.length;
  const mel=makeMelody(lines,M);
  let li=0,wi=0;

  function say(item,lineNo,isRepeat){
    const u=new SpeechSynthesisUtterance(item.w);
    u.lang='cs-CZ';
    if(voice)u.voice=voice;
    const t=item.deg/7;
    u.pitch=Math.max(.1,Math.min(2,M.lo+t*(M.hi-M.lo)+(isRepeat?.12:0)));
    // konec řádku se táhne pomaleji
    u.rate=Math.max(.1,Math.min(2,M.rate*(item.last?.8:1)));
    u.volume=1;
    let done=false;
    const go=()=>{
      if(done)return;done=true;
      const pause=item.last?(M.wild?300:900):(M.wild?40:140);
      setTimeout(step,pause);
    };
    u.onend=go;
    u.onerror=go;
    speechSynthesis.speak(u);
    // pojistka proti zaseknutí hlasu
    setTimeout(go,Math.max(3500,item.w.length*600));
  }

  function step(){
    if(!running||id!==songId)return;
    if(wi>=mel[li%n].length){
      wi=0;li++;
      if(li>=n&&performance.now()-t0>=MIN_MS-4000){
        setTimeout(()=>finish(id),M.wild?500:1500);
        return;
      }
    }
    const lineNo=li%n;
    if(wi===0)[...ly.children].forEach((e,j)=>e.classList.toggle('on',j===lineNo));
    const item=mel[lineNo][wi++];
    say(item,lineNo,li>=n);
  }
  setTimeout(step,INTRO_MS);
}

function tickProgress(id){
  if(!running||id!==songId)return;
  const p=Math.min(100,(performance.now()-t0)/MIN_MS*100);
  $('bp').style.width=p+'%';
  prog=setTimeout(()=>tickProgress(id),250);
}

function stop(){
  running=false;songId++;
  clearInterval(timer);timer=null;
  clearTimeout(prog);prog=null;
  clearInterval(keep);keep=null;
  if(hasSpeech)speechSynthesis.cancel();
  if(ctx){try{ctx.close()}catch(e){}ctx=null}
  $('st').disabled=true;
  $('go').disabled=false;
  $('go').textContent='▶ Zahrát znovu';
  [...$('ly').children].forEach(e=>e.classList.remove('on'));
}

$('go').onclick=()=>{
  const t=$('t').value.trim(),l=$('l').value.trim();
  if(!t&&!l){alert('Napiš, o čem bude písnička.');return}
  if(running)stop();
  const M=analyze(t,l);
  const lines=l?l.split(/\n+/).map(s=>s.trim()).filter(Boolean):[];
  const ly=$('ly');ly.innerHTML='';
  lines.forEach(x=>{const d=document.createElement('div');d.textContent=x;ly.appendChild(d)});
  let info='Nálada: '+M.name+' · tempo '+M.tempo+' BPM · minimálně 1 minuta';
  if(!lines.length)info+=' · bez textu, jen hudba';
  else if(!hasSpeech)info+=' · tento prohlížeč neumí zpívat hlasem, zkus jiný (Chrome, Safari)';
  else if(!voice)info+=' · český hlas nenalezen, zpívá výchozí hlas';
  $('info').textContent=info;
  $('bp').style.width='0';
  $('res').classList.remove('h');
  running=true;songId++;
  const id=songId;
  t0=performance.now();
  $('go').disabled=true;$('st').disabled=false;
  if(hasSpeech){
    // rozběhnutí hlasu přímo po kliknutí (mobily to jinak blokují)
    speechSynthesis.cancel();
    const w=new SpeechSynthesisUtterance(' ');w.volume=0;speechSynthesis.speak(w);
    keep=setInterval(()=>{if(speechSynthesis.speaking&&speechSynthesis.paused)speechSynthesis.resume()},4000);
  }
  startMusic(M,lines.length>0&&hasSpeech);
  tickProgress(id);
  if(lines.length&&hasSpeech)sing(M,lines,id);
  else setTimeout(()=>finish(id),MIN_MS+1500);
};
$('st').onclick=stop;
</script>
</body>
</html>
