;<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generátor videa</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;max-width:820px;margin:20px auto;padding:10px}
textarea{width:100%;height:100px;font-size:16px;box-sizing:border-box}
button{padding:12px 22px;font-size:17px;margin:10px 0;cursor:pointer;border:0;border-radius:8px;background:#2a7de1;color:#fff}
button:disabled{background:#555;cursor:wait}
canvas,video{width:100%;background:#000;display:block;margin-top:10px}
#bar{height:26px;background:#333;border-radius:13px;overflow:hidden;margin-top:12px;display:none}
#fill{height:100%;width:0;background:#4caf50;transition:width .2s}
#status{margin-top:8px;font-size:18px;min-height:26px}
#err{color:#ff7777;font-size:17px;margin-top:8px}
.dl{display:inline-block;margin-top:12px;padding:12px 22px;background:#4caf50;color:#fff;border-radius:8px;text-decoration:none;font-size:18px}
.hint{color:#999;font-size:14px}
</style>
</head>
<body>
<h2>Generátor videa z popisku</h2>
<p class="hint">Napiš text a délku, např. „Ahoj světe! 10 sekund“ nebo „Moje video 1 minuta“. Bez délky bude video 5 sekund.</p>
<textarea id="t">Ahoj světe! Tohle je moje první video. 10 sekund</textarea>
<button id="b">Vytvořit video</button>
<div id="bar"><div id="fill"></div></div>
<div id="status"></div>
<div id="err"></div>
<canvas id="c" width="1280" height="720"></canvas>
<div id="o"></div>

<script>
const c=document.getElementById('c'), x=c.getContext('2d');
const b=document.getElementById('b'), st=document.getElementById('status');
const o=document.getElementById('o'), err=document.getElementById('err');
const bar=document.getElementById('bar'), fill=document.getElementById('fill');
const FONT='bold 60px sans-serif', LH=84, MAXW=1080;

function parse(v){
  let d=5, text=v;
  const m=v.match(/(\d+(?:[.,]\d+)?)\s*(minut\w*|min|sekund\w*|sek|s)(?![a-zěščřžýáíéúůďťň])/i);
  if(m){
    const n=parseFloat(m[1].replace(',','.'));
    d=/^min/i.test(m[2])?n*60:n;
    text=v.replace(m[0],'').trim();
  }
  return {d:Math.min(Math.max(d,1),300), text:text||' '};
}

function layout(text){
  x.font=FONT;
  const words=text.split(/\s+/), lines=[]; let cur=[];
  for(const w of words){
    const test=[...cur,w].join(' ');
    if(x.measureText(test).width>MAXW && cur.length){lines.push(cur);cur=[w];}
    else cur.push(w);
  }
  lines.push(cur);
  const items=[], top=(c.height-lines.length*LH)/2+LH/2; let i=0;
  lines.forEach((ln,li)=>{
    const lw=x.measureText(ln.join(' ')).width;
    let px=(c.width-lw)/2;
    ln.forEach(w=>{
      items.push({w,x:px,y:top+li*LH,i:i++});
      px+=x.measureText(w+' ').width;
    });
  });
  return items;
}

function frame(el,d,items){
  const p=Math.min(el/d,1);
  const g=x.createLinearGradient(0,0,c.width,c.height);
  g.addColorStop(0,`hsl(${(p*120+220)%360},70%,25%)`);
  g.addColorStop(1,`hsl(${(p*120+280)%360},70%,12%)`);
  x.fillStyle=g; x.fillRect(0,0,c.width,c.height);
  x.font=FONT; x.textBaseline='middle'; x.textAlign='left';
  const N=items.length;
  for(const it of items){
    const start=(it.i/N)*0.8*d;
    const a=Math.min(Math.max((el-start)/0.4,0),1);
    if(a<=0) continue;
    x.globalAlpha=a; x.fillStyle='#fff';
    x.fillText(it.w,it.x,it.y+(1-a)*30);
  }
  x.globalAlpha=1;
  x.fillStyle='rgba(255,255,255,.5)';
  x.fillRect(0,c.height-8,c.width*p,8);
}

function fmt(s){
  s=Math.max(0,Math.ceil(s));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

function pickMime(){
  const list=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  for(const m of list){ if(MediaRecorder.isTypeSupported(m)) return m; }
  return '';
}

b.onclick=()=>{
  err.textContent=''; o.innerHTML='';
  if(!window.MediaRecorder || !c.captureStream){
    err.textContent='Tento prohlížeč nepodporuje nahrávání videa. Otevři soubor v Chrome nebo Edge na počítači.';
    return;
  }
  const {d,text}=parse(document.getElementById('t').value);
  const items=layout(text);
  const mime=pickMime();
  let rec;
  try{
    const stream=c.captureStream(30);
    rec=new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
  }catch(e){
    err.textContent='Nepodařilo se spustit nahrávání: '+e.message;
    return;
  }
  const chunks=[];
  rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onerror=e=>{ err.textContent='Chyba nahrávání: '+(e.error?e.error.message:'neznámá'); };
  rec.onstop=()=>{
    const type=rec.mimeType||mime||'video/webm';
    const ext=type.includes('mp4')?'mp4':'webm';
    const url=URL.createObjectURL(new Blob(chunks,{type}));
    o.innerHTML=`<video src="${url}" controls></video><a class="dl" href="${url}" download="video.${ext}">⬇ Stáhnout video</a>`;
    st.textContent='Hotovo! Video je připravené níže.';
    fill.style.width='100%'; b.disabled=false;
  };

  b.disabled=true; bar.style.display='block'; fill.style.width='0%';
  frame(0,d,items);
  rec.start(250);
  const t0=performance.now();
  const timer=setInterval(()=>{
    const el=(performance.now()-t0)/1000;
    if(el>=d){
      clearInterval(timer);
      frame(d,d,items);
      st.textContent='Dokončuji video…';
      setTimeout(()=>rec.stop(),300);
      return;
    }
    frame(el,d,items);
    fill.style.width=(el/d*100)+'%';
    st.textContent=`Nahrávám: ${Math.round(el/d*100)} %  |  zbývá ${fmt(d-el)}  |  celkem ${fmt(d)}`;
  },33);
};
</script>
</body>
</html>
