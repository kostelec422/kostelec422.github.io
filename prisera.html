<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domeček a příšera</title>
<style>
:root{--bg:#0e1424;--ink:#f3ecd8;--win:#f2c14e;--mon:#d9435f;--ok:#5fd0a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 var(--mon);transition:box-shadow .4s}
#vig.warn{animation:pulse .6s infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 0 120px 30px var(--mon)}}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:28px;text-align:center;background:var(--bg);z-index:5}
.screen h1{font-size:2.2rem;margin:0;line-height:1.1}
.screen p{max-width:34ch;margin:0;line-height:1.5;opacity:.85}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 28px;background:var(--win);color:#241a05;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;padding:12px 16px;z-index:3;text-shadow:0 1px 6px #000}
#hud img{width:52px;height:39px;object-fit:cover;border:2px solid var(--win);border-radius:6px}
#msg{position:fixed;left:16px;right:16px;bottom:calc(120px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:700;font-size:1.15rem;text-shadow:0 1px 8px #000;z-index:3}
#bar{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));height:10px;background:#0008;border-radius:9px;overflow:hidden;z-index:3;display:none}
#bar i{display:block;height:100%;width:100%;background:var(--mon);transition:width .1s linear}
#shutter{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:72px;height:72px;padding:0;border-radius:50%;background:var(--ink);border:6px solid #fff6;z-index:3}
#shutter[hidden]{display:none}
#match{position:fixed;left:16px;bottom:calc(36px + env(safe-area-inset-bottom,0px));z-index:3;font-weight:700;text-shadow:0 1px 6px #000;display:none}
#mon{position:fixed;left:50%;top:38%;width:min(92vw,440px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.2);opacity:0;z-index:2;pointer-events:none;transition:transform 1.2s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
#mon.on{opacity:1;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 0 28px #d9435f) drop-shadow(0 0 70px #000)}
.b{animation:tw .09s infinite;transform-origin:100px 110px}
@keyframes tw{50%{transform:translate(2px,-3px) rotate(1deg)}}
.eye{animation:glow .45s infinite alternate}
@keyframes glow{from{opacity:.65}to{opacity:1}}
#tune{position:fixed;left:16px;right:16px;top:calc(74px + env(safe-area-inset-top,0px));z-index:3;display:flex;align-items:center;gap:10px;font-weight:700;text-shadow:0 1px 6px #000}#tune input{flex:1;accent-color:var(--win)}#tune span{min-width:3ch;text-align:right}
.bad{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){#vig.warn{animation:none;box-shadow:inset 0 0 90px 20px var(--mon)}}
</style></head>
<body>
<video id="v" playsinline muted autoplay></video>
<div id="vig"></div>

<canvas id="mon" width="520" height="520" aria-hidden="true"></canvas>

<div id="hud" hidden><span id="score">Přežito: 0</span><img id="thumb" alt="Fotka domečku"></div>
<div id="msg"></div>
<div id="bar"><i></i></div>
<div id="match"></div>
<div id="tune" hidden><label for="sens">Shoda domečků</label><input id="sens" type="range" min="10" max="90" step="1" value="40"><span id="thr">40 %</span></div>
<button id="shutter" aria-label="Vyfotit" hidden></button>

<div class="screen" id="intro">
  <h1>Domeček a příšera</h1>
  <p>Nejdřív vyfoť svůj domeček. Pak se pohybuj po domě. Když tě příšera najde, máš 4 sekundy, aby ses vrátil k domečku a vyfotil ho znovu.</p>
  <button id="go">Zapnout kameru</button>
  <p id="err" style="color:var(--mon)"></p>
</div>

<div class="screen" id="over" hidden>
  <h1>Příšera tě dostala</h1>
  <p id="final"></p>
  <button id="again">Hrát znovu</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const v=$('#v'),cv=document.createElement('canvas');cv.width=32;cv.height=24;
const cx=cv.getContext('2d',{willReadFrequently:true});
let ref=null,state='intro',thr=.4,score=0,timers=[],tick=null,left=4,live=null;

// Zmenšený šedotónový snímek, normalizovaný (nezávislý na jasu a kontrastu)
function grab(){
  const w=v.videoWidth,h=v.videoHeight;if(!w)return null;
  let sw=w,sh=w*.75;if(sh>h){sh=h;sw=h/.75}
  cx.drawImage(v,(w-sw)/2,(h-sh)/2,sw,sh,0,0,32,24);
  const d=cx.getImageData(0,0,32,24).data,g=new Float32Array(768);let m=0;
  for(let i=0;i<768;i++){g[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];m+=g[i]}
  m/=768;let s=0;for(let i=0;i<768;i++){g[i]-=m;s+=g[i]*g[i]}
  s=Math.sqrt(s/768)||1;for(let i=0;i<768;i++)g[i]/=s;return g;
}
function sim(a,b){let s=0;for(let i=0;i<768;i++)s+=a[i]*b[i];return Math.max(0,s/768)}

// Zvuk a vibrace
let ac;function beep(f,d,t='sine',g=.15){try{ac=ac||new AudioContext();const o=ac.createOscillator(),k=ac.createGain();o.type=t;o.frequency.value=f;k.gain.value=g;o.connect(k);k.connect(ac.destination);o.start();k.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

function clearAll(){timers.forEach(clearTimeout);timers=[];clearInterval(tick);tick=null}
function say(t){$('#msg').textContent=t}

$('#go').onclick=async()=>{
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    v.srcObject=s;await v.play();
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    try{const sm=await claude.use('sample');if(sm)sm('Odpověz jen: OK',{modelTier:'quick'}).catch(()=>{})}catch(e){}
    $('#intro').hidden=true;setup();
  }catch(e){$('#err').textContent='Kamera se nespustila. Povol přístup ke kameře a otevři hru přes https.'}
};

function setup(){
  state='setup';score=0;ref=null;clearAll();
  $('#hud').hidden=true;$('#shutter').hidden=false;$('#bar').style.display='none';$('#match').style.display='none';$('#tune').hidden=true;clearInterval(window.mt);
  $('#mon').classList.remove('on');$('#vig').classList.remove('warn');
  say('Zaměř domeček a vyfoť ho');
}

function startPlay(){
  state='play';
  $('#hud').hidden=false;$('#shutter').hidden=true;
  clearInterval(window.mt);window.mt=setInterval(()=>{if(!ref||state==='over')return;const g=grab();if(g)$('#match').textContent='Shoda: '+Math.round(sim(g,ref)*100)+' %'},300);
  $('#score').textContent='Přežito: 0';
  schedule();
}

function schedule(){
  state='play';$('#shutter').hidden=true;$('#bar').style.display='none';$('#match').style.display='block';$('#tune').hidden=false;
  $('#mon').classList.remove('on');$('#vig').classList.remove('warn');
  say('Schovej se. Příšera tě hledá…');
    const delay=(5+Math.random()*25)*1000; // 5–30 s, úplně náhodně
  timers.push(setTimeout(warn,Math.max(delay-2000,3000)));
  timers.push(setTimeout(attack,Math.max(delay,5000)));
}

function warn(){ // varování ~2 s předem: vibrace, zvuk, červené okraje
  $('#vig').classList.add('warn');buzz([80,60,80]);beep(70,.6,'sawtooth',.2);
}

function attack(){
  state='attack';left=4;
  $('#mon').classList.add('on');buzz([300,100,300]);beep(110,.5,'square',.2);beep(180,.9,'sawtooth',.12);setTimeout(()=>beep(95,.7,'sawtooth',.2),250);
  $('#shutter').hidden=false;$('#bar').style.display='block';$('#match').style.display='block';$('#tune').hidden=true;
  say('Najdi domeček a vyfoť ho!');
  let last=performance.now();paused=false;
  tick=setInterval(()=>{
    const now=performance.now();if(!paused)left-=(now-last)/1000;last=now;
    $('#bar i').style.width=Math.max(0,left/4*100)+'%';
    const g=grab();if(g)$('#match').textContent='Shoda: '+Math.round(sim(g,ref)*100)+' %';
    if(left<=0)lose();
  },100);
}

function lose(){
  clearAll();state='over';
  $('#mon').style.transform='translate(-50%,-50%) scale(2.2)';buzz(600);beep(60,.9,'sawtooth',.3);
  setTimeout(()=>{
    $('#mon').style.transform='';$('#mon').classList.remove('on');
    $('#hud').hidden=true;$('#shutter').hidden=true;$('#bar').style.display='none';$('#match').style.display='none';$('#tune').hidden=true;clearInterval(window.mt);$('#vig').classList.remove('warn');say('');
    $('#final').textContent='Přežil jsi příšer: '+score;$('#over').hidden=false;
  },900);
}

$('#shutter').onclick=()=>{
  const g=grab();if(!g)return;
  if(state==='setup'){
    ref=g;snap().then(b=>refBlob=b);
    const t=document.createElement('canvas');t.width=104;t.height=78;
    const w=v.videoWidth,h=v.videoHeight;let sw=w,sh=w*.75;if(sh>h){sh=h;sw=h/.75}
    t.getContext('2d').drawImage(v,(w-sw)/2,(h-sh)/2,sw,sh,0,0,104,78);
    $('#thumb').src=t.toDataURL();beep(660,.15);startPlay();return;
  }
  if(state==='attack'){judgeShot(g);return;
    const s=sim(g,ref);
    if(s>=thr){
      clearAll();score++;$('#score').textContent='Přežito: '+score;
      beep(880,.25);buzz(60);say('Zachráněn! Příšera zmizela.');
      $('#mon').classList.remove('on');$('#vig').classList.remove('warn');
      $('#bar').style.display='none';$('#match').style.display='none';$('#shutter').hidden=true;
      timers.push(setTimeout(schedule,1800));
    }else{
      const m=$('#msg');m.textContent='Nesedí ('+Math.round(s*100)+' %). Zkus to znovu!';
      m.classList.remove('bad');void m.offsetWidth;m.classList.add('bad');beep(200,.2,'square');
    }
  }
};

let refBlob=null,paused=false,busy=false;
function snap(){return new Promise(r=>{const w=v.videoWidth,h=v.videoHeight,k=Math.min(1,640/w),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.7)})}
function win(){clearAll();score++;$('#score').textContent='Přežito: '+score;beep(880,.25);buzz(60);say('Zachráněn! Příšera zmizela.');$('#mon').classList.remove('on');$('#vig').classList.remove('warn');$('#bar').style.display='none';$('#match').style.display='none';$('#shutter').hidden=true;timers.push(setTimeout(schedule,1800))}
function fail(h){const m=$('#msg');m.textContent='Nesedí. '+(h||'Zkus to znovu!');m.classList.remove('bad');void m.offsetWidth;m.classList.add('bad');beep(200,.2,'square')}
async function judgeShot(g){
  if(busy)return;
  if(sim(g,ref)>=thr){win();return}
  busy=true;paused=true;say('Příšera zkoumá fotku…');
  let ok=false,hint='';
  try{
    const sample=await claude.use('sample');
    if(!sample||!refBlob)throw 0;
    const lim=await sample.limits();if(!lim.images)throw 0;
    const cur=await snap();
    const r=await sample.json('První obrázek je referenční fotka domečku, druhý je nová fotka. Rozhodni, jestli obě fotky zachycují stejné místo nebo stejný předmět. Buď velmi shovívavý: stačí, když je to zhruba stejné místo a podobný pohled. Úhel, vzdálenost, světlo, ostrost i posun se mohou lišit. Odmítni jen tehdy, když je jasné, že jde o jiné místo. Odpověz pouze JSON: {"score":číslo 0 až 100 (poctivé procento podobnosti obou míst: 100 = naprosto stejné místo, 0 = úplně jiné; úhel a světlo ho nesnižují),"same":true nebo false,"hint":"krátká rada česky, max 8 slov"}',{images:[refBlob,cur],modelTier:'quick'});
    ok=Number(r.score)>=thr*100;hint=r.hint||'';
  }catch(e){ok=sim(g,ref)>=thr*.7}
  busy=false;paused=false;
  if(state!=='attack')return;
  ok?win():fail(hint);
}
$('#sens').oninput=e=>{thr=e.target.value/100;$('#thr').textContent=e.target.value+' %'};
$('#again').onclick=()=>{$('#over').hidden=true;setup()};
(function(){
if(!window.THREE)return;
const cvs=document.getElementById('mon');
const R=new THREE.WebGLRenderer({canvas:cvs,alpha:true,antialias:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.setSize(520,520,false);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,.1,50);C.position.set(0,.2,5.4);
S.add(new THREE.AmbientLight(0x553344,.9));
const L1=new THREE.DirectionalLight(0xffd8b8,1.15);L1.position.set(2,3,4);S.add(L1);
const L2=new THREE.PointLight(0xff1133,1.8,14);L2.position.set(-2.5,-1,3);S.add(L2);
const skin=new THREE.MeshStandardMaterial({color:0x4a5d3f,roughness:.55,metalness:.05});
const dark=new THREE.MeshStandardMaterial({color:0x2d3a2b,roughness:.7});
const bone=new THREE.MeshStandardMaterial({color:0xe8dfc0,roughness:.4});
const gum=new THREE.MeshStandardMaterial({color:0x4a0010,roughness:.8,emissive:0x2a0008});
const tm=new THREE.MeshStandardMaterial({color:0xc2234a,roughness:.35,emissive:0x400010});
const eyeMat=new THREE.MeshStandardMaterial({color:0xffd23f,emissive:0xffb000,emissiveIntensity:1});
const black=new THREE.MeshBasicMaterial({color:0x000000});
const root=new THREE.Group();S.add(root);
// hlava s hrbolatou kůží
const hg=new THREE.SphereGeometry(1,48,36),p=hg.attributes.position;
for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
 const n=1+.07*Math.sin(x*7+y*5)*Math.cos(z*6+x*3)+.04*Math.sin(y*13+z*9);p.setXYZ(i,x*n*1.1,y*n,z*n)}
hg.computeVertexNormals();
const head=new THREE.Mesh(hg,skin);head.position.y=.25;head.rotation.x=.18;root.add(head);
const add=(m,x,y,z,par)=>{m.position.set(x,y,z);(par||root).add(m);return m};
const ball=(r,mat)=>new THREE.Mesh(new THREE.SphereGeometry(r,20,16),mat);
for(const s of[-1,1]){
 const e=add(ball(.2,eyeMat),s*.4,.72,.78);e.scale.y=.6;
 const pu=ball(1,black);pu.scale.set(.04,.1,.04);add(pu,s*.4,.72,.97);
 const br=ball(1,dark);br.scale.set(.42,.15,.26);br.rotation.z=s*.6;add(br,s*.4,.9,.93);
 const h=new THREE.Mesh(new THREE.ConeGeometry(.17,.95,14),bone);h.rotation.z=-s*.45;add(h,s*.68,1.35,-.05);
 const nz=ball(.06,black);add(nz,s*.12,.38,1.04);
}
// dutina a horní zuby
const cav=ball(1,gum);cav.scale.set(.72,.3,.62);add(cav,0,-.12,.5);
for(let k=-6;k<=6;k++){const a=k*.2,t=new THREE.Mesh(new THREE.ConeGeometry(.07,.26,8),bone);
 t.rotation.x=Math.PI;add(t,Math.sin(a)*.72,-.12,.28+Math.cos(a)*.62);}
// čelist
const jaw=new THREE.Group();jaw.position.set(0,-.12,-.1);root.add(jaw);
const jm=ball(1,skin);jm.scale.set(.85,.3,.88);add(jm,0,-.1,.65,jaw);
for(let k=-5;k<=5;k++){const a=k*.22,t=new THREE.Mesh(new THREE.ConeGeometry(.075,.3,8),bone);
 add(t,Math.sin(a)*.7,.22,.65+Math.cos(a)*.7,jaw);}
// jazyk
const tongue=new THREE.Mesh(new THREE.BufferGeometry(),tm);root.add(tongue);
const tip=ball(.2,tm);tip.scale.set(1.15,.5,1.3);root.add(tip);
function setTongue(len,t){
 const pts=[],n=10;
 for(let i=0;i<=n;i++){const u=i/n,l=u*len;
  pts.push(new THREE.Vector3(Math.sin(t*9+u*6)*.14*u,-.5-l*.3+Math.sin(t*7+u*5)*.06*u,.7+l*.75))}
 const g=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),24,.15,10,false);
 tongue.geometry.dispose();tongue.geometry=g;
 const e=pts[n];tip.position.copy(e);
}
let t0=0,was=false;
function loop(ms){requestAnimationFrame(loop);
 if(!cvs.classList.contains('on')){was=false;return}
 if(!was){was=true;t0=ms}
 const t=(ms-t0)/1000,e=1-Math.pow(1-Math.min(1,t),3);
 root.position.z=-2.5+e*2.4;root.position.y=Math.sin(t*3)*.05;
 root.rotation.y=Math.sin(t*1.7)*.25;root.rotation.z=Math.sin(t*2.3)*.07;
 root.scale.setScalar(1+Math.sin(t*5)*.015+Math.max(0,t-2.5)*.07);
 jaw.rotation.x=.3+.5*Math.min(1,t/1.1)+.12*Math.sin(t*10);
 setTongue(.3+Math.max(0,Math.min(1,(t-.8)/.9))*1.6,t);
 eyeMat.emissiveIntensity=1+.4*Math.sin(t*14);
 R.render(S,C)}
requestAnimationFrame(loop);
})();
</script>
</body></html>
