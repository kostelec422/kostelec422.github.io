<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cesta za pivem</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1b2a41; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  #sceneWrap { position: relative; flex: 1; min-height: 0; }
  #scene { width: 100%; height: 100%; display: block; }
  #msg {
    position: absolute; left: 12px; right: 12px; top: 12px;
    text-align: center; font-size: clamp(22px, 6vw, 34px); font-weight: 800;
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.55);
    background: rgba(0,0,0,.28); border-radius: 18px; padding: 10px 12px;
    pointer-events: none; line-height: 1.2;
  }
  #bar {
    position: absolute; left: 16px; right: 16px; bottom: 10px; height: 14px;
    background: rgba(255,255,255,.55); border-radius: 10px; overflow: hidden;
    border: 2px solid rgba(0,0,0,.25);
  }
  #barFill { height: 100%; width: 0%; background: #f6b400; transition: width .1s linear; }
  #buttons { display: flex; gap: 10px; padding: 10px; height: 38%; }
  .btn {
    flex: 1; border: none; border-radius: 28px; color: #fff;
    font-size: clamp(26px, 8vw, 44px); font-weight: 800;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 8px 0 rgba(0,0,0,.35); transition: transform .06s, box-shadow .06s, filter .06s;
    touch-action: none;
  }
  .btn small { font-size: clamp(14px, 4vw, 20px); font-weight: 600; opacity: .95; }
  .btn .face { font-size: clamp(56px, 18vw, 96px); line-height: 1; }
  #b0 { background: #e0457b; }
  #b1 { background: #2f7de1; }
  .btn.down { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.35); filter: brightness(1.2); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
    background: rgba(20, 30, 50, .88); color: #fff;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(34px, 10vw, 56px); }
  .overlay p { margin: 0; font-size: clamp(20px, 5.5vw, 28px); line-height: 1.35; max-width: 520px; }
  .big {
    border: none; border-radius: 28px; background: #f6b400; color: #3a2600;
    font-size: clamp(28px, 8vw, 40px); font-weight: 800; padding: 18px 40px;
    box-shadow: 0 8px 0 #a77a00;
  }
  .big:active { transform: translateY(6px); box-shadow: 0 2px 0 #a77a00; }
  #win { background: rgba(0,0,0,0); pointer-events: none; justify-content: flex-end; padding-bottom: 40px; }
  #win .big { pointer-events: auto; }
  #win h1 { text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  .love { font-size: clamp(16px, 4.5vw, 22px); opacity: .85; }
</style>
</head>
<body>
<div id="app">
  <div id="sceneWrap">
    <canvas id="scene"></canvas>
    <div id="msg">Držte obě tlačítka a jděte!</div>
    <div id="bar"><div id="barFill"></div></div>
  </div>
  <div id="buttons">
    <button class="btn" id="b0"><span class="face">👵</span>Babička<small>držet</small></button>
    <button class="btn" id="b1"><span class="face">👴</span>Děda<small>držet</small></button>
  </div>
</div>
<canvas id="fx"></canvas>

<div class="overlay" id="start">
  <h1>🍺 Cesta za pivem 🍺</h1>
  <p>Babičko, dědo, <b>držte oba svá tlačítka</b> a půjdete spolu.<br>
     Když přijde překážka, musíte <b>oba zmáčknout naráz</b> a přeskočit ji.</p>
  <p>Na konci vás čeká pivo a ohňostroj!</p>
  <button class="big" id="playBtn">Hrát</button>
  <div class="love">Od vnoučka s láskou ❤️</div>
</div>

<div class="overlay hidden" id="win">
  <h1>Na zdraví! 🍻</h1>
  <button class="big" id="againBtn">Hrát znovu</button>
</div>

<script>
(() => {
  const scene = document.getElementById('scene');
  const ctx = scene.getContext('2d');
  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');
  const msg = document.getElementById('msg');
  const barFill = document.getElementById('barFill');
  const startEl = document.getElementById('start');
  const winEl = document.getElementById('win');
  const btns = [document.getElementById('b0'), document.getElementById('b1')];
  const names = ['Babička', 'Děda'];

  const GOAL = 1000;
  const SPEED = 90;
  const K = 1.4;                 // pixelů na jednotku
  const STOP_GAP = 60;
  const obstacles = [
    { at: 300, emoji: '🌊', name: 'Kaluž' },
    { at: 600, emoji: '🪨', name: 'Kámen' },
    { at: 850, emoji: '🪵', name: 'Klacek' },
  ];

  let W = 0, H = 0, dpr = 1;
  let state = 'idle';            // idle | walk | obstacle | jump | win
  let pos = 0, t = 0, obsIndex = 0;
  let armedAt = 0, jump = null, winT = 0, nextBurst = 0;
  let hintTimer = 0;
  const holding = [false, false];
  const pointers = [new Set(), new Set()];
  const lastPress = [0, 0];
  let particles = [];
  let audio = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const r = scene.getBoundingClientRect();
    W = r.width; H = r.height;
    scene.width = W * dpr; scene.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);

  /* ---------- zvuk ---------- */
  function ensureAudio() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) {}
  }
  function boom(freq = 120, len = 0.35, vol = 0.25) {
    if (!audio) return;
    try {
      const n = Math.floor(audio.sampleRate * len);
      const buf = audio.createBuffer(1, n, audio.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      const src = audio.createBufferSource(); src.buffer = buf;
      const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq * 6;
      const g = audio.createGain(); g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(audio.destination); src.start();
    } catch (e) {}
  }
  function blip(freq) {
    if (!audio) return;
    try {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.type = 'triangle';
      g.gain.setValueAtTime(0.2, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.26);
    } catch (e) {}
  }

  /* ---------- ovládání ---------- */
  btns.forEach((b, i) => {
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (_) {}
      pointers[i].add(e.pointerId);
      holding[i] = true;
      b.classList.add('down');
      lastPress[i] = performance.now();
      onPress(i);
    });
    const up = e => {
      pointers[i].delete(e.pointerId);
      if (pointers[i].size === 0) { holding[i] = false; b.classList.remove('down'); }
    };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  function onPress(i) {
    if (state !== 'obstacle') return;
    const a = lastPress[0], b = lastPress[1];
    if (a > armedAt && b > armedAt) {
      if (Math.abs(a - b) < 700) {
        startJump();
      } else {
        setMsg('Skoro! Zkuste to znovu, ale opravdu oba naráz!');
        lastPress[0] = lastPress[1] = 0;
      }
    } else {
      setMsg(`${names[i]} už je připravená, ještě ${names[1 - i]}!`.replace('připravená', i === 0 ? 'připravená' : 'připravený'));
      hintTimer = performance.now() + 1500;
    }
  }

  function setMsg(s) { if (msg.textContent !== s) msg.textContent = s; }

  /* ---------- hra ---------- */
  function startGame() {
    ensureAudio();
    pos = 0; obsIndex = 0; jump = null; particles = [];
    state = 'walk';
    startEl.classList.add('hidden');
    winEl.classList.add('hidden');
    document.getElementById('buttons').style.visibility = 'visible';
    msg.style.display = '';
    setMsg('Držte obě tlačítka a jděte!');
  }
  document.getElementById('playBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);

  function startJump() {
    const o = obstacles[obsIndex];
    jump = { t: 0, from: pos, to: o.at + 70 };
    state = 'jump';
    setMsg('Hop! 🎉');
    blip(660); setTimeout(() => blip(880), 120);
    if (navigator.vibrate) navigator.vibrate(60);
  }

  function win() {
    state = 'win'; winT = 0; nextBurst = 0;
    msg.style.display = 'none';
    document.getElementById('buttons').style.visibility = 'hidden';
    winEl.classList.remove('hidden');
  }

  function update(dt) {
    t += dt;
    if (state === 'walk') {
      const both = holding[0] && holding[1];
      if (both) {
        pos += SPEED * dt;
        setMsg('Jdeme! 🚶');
      } else if (holding[0] || holding[1]) {
        const who = holding[0] ? 1 : 0;
        setMsg(who === 1 ? 'Děda, drž tlačítko taky!' : 'Babičko, drž tlačítko taky!');
      } else {
        setMsg('Držte obě tlačítka a jděte!');
      }
      const o = obstacles[obsIndex];
      if (o && pos >= o.at - STOP_GAP) {
        pos = o.at - STOP_GAP;
        state = 'obstacle';
        armedAt = performance.now();
        lastPress[0] = lastPress[1] = 0;
        setMsg(`${o.name}! Pusťte a zmáčkněte oba naráz!`);
        blip(220);
      } else if (pos >= GOAL - 60) {
        pos = GOAL - 60;
        win();
      }
    } else if (state === 'obstacle') {
      if (hintTimer && performance.now() > hintTimer) {
        hintTimer = 0;
        const o = obstacles[obsIndex];
        setMsg(`${o.name}! Pusťte a zmáčkněte oba naráz!`);
      }
    } else if (state === 'jump') {
      jump.t += dt / 0.7;
      const k = Math.min(jump.t, 1);
      pos = jump.from + (jump.to - jump.from) * k;
      if (k >= 1) {
        obsIndex++;
        jump = null;
        state = 'walk';
      }
    } else if (state === 'win') {
      winT += dt;
      nextBurst -= dt;
      if (nextBurst <= 0) { burst(); nextBurst = 0.35 + Math.random() * 0.3; }
    }
    barFill.style.width = Math.min(100, (pos / (GOAL - 60)) * 100) + '%';
  }

  /* ---------- ohňostroj ---------- */
  function burst(x, y) {
    x = x ?? innerWidth * (0.15 + Math.random() * 0.7);
    y = y ?? innerHeight * (0.12 + Math.random() * 0.4);
    const hue = Math.random() * 360;
    const n = 55 + Math.floor(Math.random() * 25);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 60 + Math.random() * 170;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, decay: 0.45 + Math.random() * 0.5,
        color: `hsl(${(hue + Math.random() * 50) % 360} 100% 60%)`,
        r: 2 + Math.random() * 2.5,
      });
    }
    boom(80 + Math.random() * 80, 0.4, 0.22);
  }

  function drawFx(dt) {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    fctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      p.vy += 120 * dt;
      p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) continue;
      fctx.globalAlpha = Math.max(p.life, 0);
      fctx.fillStyle = p.color;
      fctx.beginPath(); fctx.arc(p.x, p.y, p.r, 0, 7); fctx.fill();
    }
    fctx.globalAlpha = 1;
    fctx.globalCompositeOperation = 'source-over';
    particles = particles.filter(p => p.life > 0);
  }

  /* ---------- kreslení scény ---------- */
  function emoji(ch, x, y, size, align = 'center') {
    ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'bottom';
    ctx.fillText(ch, x, y);
  }

  function draw() {
    const groundY = H * 0.74;
    const size = Math.min(H * 0.24, 96);
    const night = state === 'win' ? Math.min(winT / 1.5, 1) : 0;

    const sky = ctx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0, '#5aaee8'); sky.addColorStop(1, '#bfe6ff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    emoji('☀️', W * 0.82, H * 0.3, size * 0.8);

    // mraky
    for (let i = 0; i < 4; i++) {
      const span = W + 160;
      const x = ((i * 190 - pos * 0.25) % span + span) % span - 80;
      emoji('☁️', x, H * (0.2 + (i % 2) * 0.1), size * 0.8);
    }

    // kopce
    ctx.fillStyle = '#7ec36b';
    for (let i = -1; i < 6; i++) {
      const span = 260;
      const x = i * span - ((pos * 0.5) % span);
      ctx.beginPath(); ctx.arc(x + 130, groundY + 10, 120, Math.PI, 0); ctx.fill();
    }

    // zem
    ctx.fillStyle = '#5fae4a'; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#c9a26b'; ctx.fillRect(0, groundY + (H - groundY) * 0.25, W, (H - groundY) * 0.5);

    const charX = W * 0.3;

    // stromy
    for (let wx = 0; wx < GOAL + 400; wx += 140) {
      const sx = charX + (wx - pos) * K;
      if (sx < -80 || sx > W + 80) continue;
      emoji('🌳', sx, groundY + 8, size * 0.9);
    }

    // překážky
    obstacles.forEach((o, i) => {
      if (i < obsIndex && !(jump && i === obsIndex)) {
        // už přeskočeno – nech ji vzadu
      }
      const sx = charX + (o.at - pos) * K;
      if (sx < -80 || sx > W + 80) return;
      emoji(o.emoji, sx, groundY + (H - groundY) * 0.62, size);
    });

    // cíl – pivo
    const gx = charX + (GOAL - pos) * K;
    if (gx > -120 && gx < W + 120) {
      const bob = Math.sin(t * 4) * 4;
      emoji('🍺', gx, groundY + (H - groundY) * 0.62 + bob, size * 1.5);
      emoji('✨', gx - size * 0.9, groundY - size * 0.2 + bob, size * 0.6);
      emoji('✨', gx + size * 0.9, groundY - size * 0.5 + bob, size * 0.6);
    }

    // postavy
    const walking = (state === 'walk' && holding[0] && holding[1]);
    const bob = walking ? Math.abs(Math.sin(t * 12)) * 8 : 0;
    const jy = jump ? Math.sin(Math.PI * Math.min(jump.t, 1)) * size * 0.9 : 0;
    const baseY = groundY + (H - groundY) * 0.62 - bob - jy;
    emoji('👵', charX - size * 0.45, baseY, size);
    emoji('👴', charX + size * 0.45, baseY, size);
    // ruce k sobě
    if (state !== 'idle') emoji('❤️', charX, baseY - size * 1.0 - jy * 0.1, size * 0.4);

    if (night > 0) {
      ctx.fillStyle = `rgba(8, 12, 40, ${night * 0.82})`;
      ctx.fillRect(0, 0, W, H);
      // pivo zůstane vidět
      emoji('🍺', gx, groundY + (H - groundY) * 0.62, size * 1.5);
      emoji('👵', charX - size * 0.45, baseY, size);
      emoji('👴', charX + size * 0.45, baseY, size);
    }
  }

  /* ---------- smyčka ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    drawFx(dt);
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
